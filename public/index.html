<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>UZCOIN</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3e5ae;
      color: #202020;
      overflow-x: hidden;
      user-select: none;
    }

    body {
      min-height: 100vh;
    }

    button {
      font: inherit;
      border: 0;
      outline: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3e5ae;
      font-size: 22px;
      font-weight: 800;
    }

    #app {
      width: 100%;
      min-height: 100vh;
      padding-bottom: 105px;
      background:
        radial-gradient(
          circle at 50% 25%,
          #fff5c9 0%,
          #f3e5ae 42%,
          #e8d58f 100%
        );
    }

    .page {
      display: none;
      min-height: calc(100vh - 105px);
      padding: 22px 18px 20px;
    }

    .page.active {
      display: block;
    }

    /* HOME */

    .home {
      text-align: center;
    }

    .league {
      padding-top: 3px;
      margin-bottom: 18px;
    }

    .league-cup {
      font-size: 45px;
      line-height: 45px;
      filter: drop-shadow(0 5px 5px rgba(0,0,0,.12));
    }

    .league-name {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .balance {
      margin-top: 8px;
      font-size: 38px;
      line-height: 42px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .coin-label {
      margin-top: 2px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      opacity: .55;
    }

    /* COIN */

    .coin-area {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 26px;
      margin-bottom: 22px;
    }

    .coin {
      position: relative;
      width: 225px;
      height: 225px;
      border-radius: 50%;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 35% 27%,
          #fff5a6 0%,
          #ffe45d 22%,
          #ffc928 58%,
          #e8a900 100%
        );

      border: 8px solid #d99b00;

      box-shadow:
        inset 0 8px 0 rgba(255,255,255,.38),
        inset 0 -12px 16px rgba(173,103,0,.23),
        0 15px 30px rgba(130,91,0,.25);

      transition:
        transform .08s ease,
        box-shadow .08s ease;
    }

    .coin::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.3);
    }

    .coin:active {
      transform: scale(.94);
      box-shadow:
        inset 0 8px 0 rgba(255,255,255,.25),
        inset 0 -8px 12px rgba(173,103,0,.25),
        0 7px 15px rgba(130,91,0,.2);
    }

    .coin-symbol {
      position: relative;
      z-index: 2;
      font-size: 82px;
      font-weight: 1000;
      letter-spacing: -7px;
      color: #fff7b0;
      text-shadow:
        0 4px 0 #d79a00,
        0 7px 12px rgba(120,75,0,.25);
    }

    .tap-number {
      position: fixed;
      z-index: 500;
      pointer-events: none;
      font-size: 27px;
      font-weight: 900;
      color: #9a6b00;
      animation: tapFloat .65s ease-out forwards;
    }

    @keyframes tapFloat {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      100% {
        opacity: 0;
        transform: translateY(-75px) scale(1.2);
      }
    }

    /* ENERGY */

    .energy-box {
      width: min(390px, 100%);
      margin: 0 auto;
    }

    .energy-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 16px;
      font-weight: 900;
    }

    .energy-icon {
      font-size: 20px;
    }

    .energy-bar {
      width: 100%;
      height: 9px;
      margin-top: 9px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255,255,255,.45);
    }

    .energy-fill {
      height: 100%;
      width: 100%;
      border-radius: 20px;
      background: #222;
      transition: width .2s ease;
    }

    /* BOOST */

    .boost-section {
      width: min(440px, 100%);
      margin: 28px auto 0;
      text-align: left;
    }

    .boost-title {
      margin: 0 0 10px 5px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;
      opacity: .55;
    }

    .boost-card {
      overflow: hidden;
      border-radius: 21px;
      background: rgba(255,255,255,.42);
      box-shadow: 0 7px 20px rgba(100,75,0,.08);
    }

    .boost-row {
      width: 100%;
      min-height: 76px;
      padding: 12px 15px;

      display: flex;
      align-items: center;
      gap: 12px;

      background: transparent;
      text-align: left;
      cursor: pointer;

      transition: background .15s ease;
    }

    .boost-row + .boost-row {
      border-top: 1px solid rgba(0,0,0,.07);
    }

    .boost-row:active {
      background: rgba(255,255,255,.35);
    }

    .boost-row.disabled {
      opacity: .48;
    }

    .boost-icon {
      width: 43px;
      height: 43px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: rgba(255,255,255,.65);
      font-size: 22px;
    }

    .boost-main {
      flex: 1;
      min-width: 0;
    }

    .boost-name {
      font-size: 14px;
      font-weight: 900;
    }

    .boost-level {
      margin-top: 4px;
      font-size: 12px;
      opacity: .55;
    }

    .boost-price {
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    /* OTHER PAGES */

    .page-title {
      padding-top: 10px;
      text-align: center;
      font-size: 28px;
      font-weight: 1000;
    }

    .page-subtitle {
      margin-top: 7px;
      text-align: center;
      font-size: 13px;
      opacity: .55;
    }

    .rank-list {
      margin-top: 25px;
    }

    .rank-item {
      display: flex;
      align-items: center;
      gap: 12px;

      min-height: 65px;
      padding: 10px 14px;
      margin-bottom: 9px;

      border-radius: 17px;
      background: rgba(255,255,255,.42);
    }

    .rank-number {
      width: 35px;
      font-size: 17px;
      font-weight: 900;
      text-align: center;
    }

    .rank-user {
      flex: 1;
      font-size: 14px;
      font-weight: 800;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .rank-balance {
      font-size: 13px;
      font-weight: 900;
    }

    .friends-card {
      margin-top: 25px;
      padding: 25px 20px;
      border-radius: 23px;
      background: rgba(255,255,255,.42);
      text-align: center;
    }

    .friends-icon {
      font-size: 52px;
    }

    .friends-card h3 {
      margin: 13px 0 7px;
      font-size: 21px;
    }

    .friends-card p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      opacity: .62;
    }

    .invite-btn {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border-radius: 16px;
      background: #222;
      color: white;
      font-weight: 900;
      cursor: pointer;
    }

    .profile-card {
      margin-top: 25px;
      padding: 22px;
      border-radius: 23px;
      background: rgba(255,255,255,.42);
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      padding: 13px 0;
      border-bottom: 1px solid rgba(0,0,0,.07);
      font-size: 14px;
    }

    .profile-row:last-child {
      border-bottom: 0;
    }

    .profile-label {
      opacity: .55;
    }

    .profile-value {
      font-weight: 900;
    }

    /* NAV */

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 13px;
      z-index: 100;

      transform: translateX(-50%);

      width: min(430px, calc(100% - 22px));
      height: 72px;

      display: grid;
      grid-template-columns: repeat(4, 1fr);

      padding: 7px;

      border-radius: 24px;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      box-shadow: 0 10px 35px rgba(70,50,0,.15);
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;

      border-radius: 18px;
      background: transparent;
      color: #777;

      cursor: pointer;
    }

    .nav-btn.active {
      background: rgba(0,0,0,.08);
      color: #202020;
    }

    .nav-icon {
      font-size: 22px;
      line-height: 22px;
    }

    .nav-text {
      font-size: 10px;
      font-weight: 800;
    }

    /* SMALL PHONES */

    @media (max-width: 360px) {
      .coin {
        width: 195px;
        height: 195px;
      }

      .coin-symbol {
        font-size: 70px;
      }

      .balance {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <div id="loading">
    UZCOIN
  </div>

  <main id="app">

    <!-- HOME -->
    <section id="homePage" class="page active home">

      <div class="league">
        <div id="leagueCup" class="league-cup">🥉</div>
        <div id="leagueName" class="league-name">BRONZE</div>
      </div>

      <div id="balance" class="balance">0</div>
      <div class="coin-label">UZCOIN</div>

      <div class="coin-area">
        <div id="coin" class="coin">
          <div id="coinSymbol" class="coin-symbol">UZ</div>
        </div>
      </div>

      <div class="energy-box">

        <div class="energy-info">
          <span class="energy-icon">⚡</span>
          <span id="energyText">100 / 100</span>
        </div>

        <div class="energy-bar">
          <div id="energyFill" class="energy-fill"></div>
        </div>

      </div>

      <!-- BOOST -->
      <div class="boost-section">

        <div class="boost-title">BOOST</div>

        <div class="boost-card">

          <button id="tapUpgrade" class="boost-row">

            <div class="boost-icon">🪙</div>

            <div class="boost-main">
              <div class="boost-name">TAP POWER</div>

              <div class="boost-level">
                Level <span id="tapLevel">1</span>
                →
                <span id="tapNextLevel">2</span>
              </div>
            </div>

            <div class="boost-price">
              <span id="tapUpgradeCost">500</span> 🪙
            </div>

          </button>

          <button id="energyUpgrade" class="boost-row">

            <div class="boost-icon">⚡</div>

            <div class="boost-main">
              <div class="boost-name">MAX ENERGY</div>

              <div class="boost-level">
                <span id="energyCurrent">100</span>
                →
                <span id="energyNext">200</span>
              </div>
            </div>

            <div class="boost-price">
              <span id="energyUpgradeCost">1000</span> 🪙
            </div>

          </button>

        </div>
      </div>

    </section>


    <!-- RANK -->
    <section id="rankPage" class="page">

      <div class="page-title">🏆 RANK</div>

      <div class="page-subtitle">
        UZCOIN reytingi
      </div>

      <div id="rankList" class="rank-list">
        Yuklanmoqda...
      </div>

    </section>


    <!-- FRIENDS -->
    <section id="friendsPage" class="page">

      <div class="page-title">👥 FRIENDS</div>

      <div class="friends-card">

        <div class="friends-icon">👥</div>

        <h3>Do‘stlaringni taklif qil</h3>

        <p>
          Do‘stlaring UZCOIN'ga qo‘shilsa,
          birga ko‘proq coin yig‘ishingiz mumkin.
        </p>

        <button id="inviteBtn" class="invite-btn">
          INVITE FRIENDS
        </button>

      </div>

    </section>


    <!-- PROFILE -->
    <section id="profilePage" class="page">

      <div class="page-title">👤 PROFILE</div>

      <div class="profile-card">

        <div class="profile-row">
          <span class="profile-label">Balance</span>
          <span id="profileBalance" class="profile-value">0 🪙</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">League</span>
          <span id="profileLeague" class="profile-value">BRONZE</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Tap Power</span>
          <span id="profilePower" class="profile-value">+1</span>
        </div>

        <div class="profile-row">
          <span class="profile-label">Max Energy</span>
          <span id="profileEnergy" class="profile-value">100</span>
        </div>

      </div>

    </section>


    <!-- NAV -->

    <nav class="bottom-nav">

      <button class="nav-btn active" data-page="homePage">
        <span class="nav-icon">🪙</span>
        <span class="nav-text">Home</span>
      </button>

      <button class="nav-btn" data-page="rankPage">
        <span class="nav-icon">🏆</span>
        <span class="nav-text">Rank</span>
      </button>

      <button class="nav-btn" data-page="friendsPage">
        <span class="nav-icon">👥</span>
        <span class="nav-text">Friends</span>
      </button>

      <button class="nav-btn" data-page="profilePage">
        <span class="nav-icon">👤</span>
        <span class="nav-text">Profile</span>
      </button>

    </nav>

  </main>


  <script>

    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      try {
        tg.setHeaderColor("#f3e5ae");
        tg.setBackgroundColor("#f3e5ae");
      } catch (e) {}
    }


    /* USER */

    const telegramId =
      tg?.initDataUnsafe?.user?.id?.toString() ||
      "demo-user";


    /* STATE */

    let balance = 0;

    let energy = 100;
    let maxEnergy = 100;

    let power = 1;

    let tapLevel = 1;
    let energyLevel = 1;

    let tapQueue = 0;
    let syncing = false;


    /* LEAGUES */

    const LEAGUES = [

      {
        min: 0,
        name: "BRONZE",
        icon: "🥉"
      },

      {
        min: 2000,
        name: "SILVER",
        icon: "🥈"
      },

      {
        min: 10000,
        name: "GOLD",
        icon: "🥇"
      },

      {
        min: 50000,
        name: "DIAMOND",
        icon: "💎"
      },

      {
        min: 100000,
        name: "MASTER",
        icon: "👑"
      }

    ];


    function getLeague(value) {

      let current = LEAGUES[0];

      for (const league of LEAGUES) {

        if (value >= league.min) {
          current = league;
        }

      }

      return current;
    }


    /* ELEMENTS */

    const balanceEl =
      document.getElementById("balance");

    const energyTextEl =
      document.getElementById("energyText");

    const energyFillEl =
      document.getElementById("energyFill");

    const coin =
      document.getElementById("coin");

    const leagueCup =
      document.getElementById("leagueCup");

    const leagueName =
      document.getElementById("leagueName");

    const profileBalance =
      document.getElementById("profileBalance");

    const profileLeague =
      document.getElementById("profileLeague");

    const profilePower =
      document.getElementById("profilePower");

    const profileEnergy =
      document.getElementById("profileEnergy");


    /* FORMAT */

    function formatNumber(value) {

      return Number(value || 0).toLocaleString("en-US");

    }


    /* UPGRADE COSTS */

    function getTapUpgradeCost() {

      return Math.floor(500 * Math.pow(1.8, tapLevel - 1));

    }


    function getEnergyUpgradeCost() {

      return Math.floor(1000 * Math.pow(1.75, energyLevel - 1));

    }


    /* UPDATE UI */

    function updateUI() {

      balanceEl.textContent =
        formatNumber(balance);


      energyTextEl.textContent =
        `${Math.max(0, Math.floor(energy))} / ${maxEnergy}`;


      const percent =
        Math.max(
          0,
          Math.min(
            100,
            (energy / maxEnergy) * 100
          )
        );


      energyFillEl.style.width =
        percent + "%";


      const league =
        getLeague(balance);


      leagueCup.textContent =
        league.icon;


      leagueName.textContent =
        league.name;


      /* PROFILE */

      profileBalance.textContent =
        formatNumber(balance) + " 🪙";

      profileLeague.textContent =
        league.name;

      profilePower.textContent =
        "+" + power;

      profileEnergy.textContent =
        formatNumber(maxEnergy);


      /* TAP UPGRADE */

      const tapCost =
        getTapUpgradeCost();

      document.getElementById("tapLevel")
        .textContent = tapLevel;

      document.getElementById("tapNextLevel")
        .textContent = tapLevel + 1;

      document.getElementById("tapUpgradeCost")
        .textContent = formatNumber(tapCost);


      const tapButton =
        document.getElementById("tapUpgrade");

      tapButton.classList.toggle(
        "disabled",
        balance < tapCost
      );


      /* ENERGY UPGRADE */

      const energyCost =
        getEnergyUpgradeCost();

      document.getElementById("energyCurrent")
        .textContent = maxEnergy;

      document.getElementById("energyNext")
        .textContent = maxEnergy + 100;

      document.getElementById("energyUpgradeCost")
        .textContent = formatNumber(energyCost);


      const energyButton =
        document.getElementById("energyUpgrade");

      energyButton.classList.toggle(
        "disabled",
        balance < energyCost
      );

    }


    /* TAP NUMBER */

    function showTapNumber(event, amount) {

      const element =
        document.createElement("div");

      element.className =
        "tap-number";

      element.textContent =
        "+" + amount;


      element.style.left =
        event.clientX + "px";

      element.style.top =
        event.clientY + "px";


      document.body.appendChild(element);


      setTimeout(() => {

        element.remove();

      }, 700);

    }


    /* TAP */

    coin.addEventListener(
      "pointerdown",
      event => {

        if (energy < power) {
          return;
        }


        balance += power;

        energy -= power;

        tapQueue += 1;


        showTapNumber(
          event,
          power
        );


        updateUI();


        if (navigator.vibrate) {

          navigator.vibrate(12);

        }


        sendTap();

      }
    );


    /* SEND TAP */

    async function sendTap() {

      if (
        tapQueue <= 0 ||
        syncing
      ) {
        return;
      }


      syncing = true;


      const taps =
        tapQueue;


      tapQueue = 0;


      try {

        const response =
          await fetch(
            "/api/tap",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                telegramId,
                taps
              })
            }
          );


        if (!response.ok) {
          throw new Error(
            "Tap request failed"
          );
        }


        const data =
          await response.json();


        if (
          typeof data.balance ===
          "number"
        ) {
          balance =
            data.balance;
        }


        if (
          typeof data.energy ===
          "number"
        ) {
          energy =
            data.energy;
        }


      } catch (error) {

        console.log(
          "Tap error:",
          error
        );

      }


      syncing = false;

      updateUI();

    }


    /* TAP UPGRADE */

    document
      .getElementById("tapUpgrade")
      .addEventListener(
        "click",
        async () => {

          const cost =
            getTapUpgradeCost();


          if (balance < cost) {

            return;

          }


          try {

            const response =
              await fetch(
                "/api/upgrade",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({
                    telegramId,
                    type: "tap"
                  })
                }
              );


            const data =
              await response.json();


            if (!response.ok) {

              alert(
                data.error ||
                "Upgrade amalga oshmadi"
              );

              return;

            }


            balance =
              data.balance;

            power =
              data.power;

            tapLevel =
              data.tapLevel;


            updateUI();


            if (navigator.vibrate) {
              navigator.vibrate(25);
            }


          } catch (error) {

            console.log(
              "Tap upgrade error:",
              error
            );

          }

        }
      );


    /* ENERGY UPGRADE */

    document
      .getElementById("energyUpgrade")
      .addEventListener(
        "click",
        async () => {

          const cost =
            getEnergyUpgradeCost();


          if (balance < cost) {

            return;

          }


          try {

            const response =
              await fetch(
                "/api/upgrade",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({
                    telegramId,
                    type: "energy"
                  })
                }
              );


            const data =
              await response.json();


            if (!response.ok) {

              alert(
                data.error ||
                "Upgrade amalga oshmadi"
              );

              return;

            }


            balance =
              data.balance;

            maxEnergy =
              data.maxEnergy;

            energy =
              data.energy;

            energyLevel =
              data.energyLevel;


            updateUI();


            if (navigator.vibrate) {
              navigator.vibrate(25);
            }


          } catch (error) {

            console.log(
              "Energy upgrade error:",
              error
            );

          }

        }
      );


    /* ENERGY REGEN */

    setInterval(() => {

      if (energy < maxEnergy) {

        energy =
          Math.min(
            maxEnergy,
            energy + 1
          );

        updateUI();

      }

    }, 1000);


    /* LOAD USER */

    async function loadUser() {

      try {

        const response =
          await fetch(
            "/api/user/" +
            telegramId
          );


        if (!response.ok) {

          throw new Error(
            "User load failed"
          );

        }


        const data =
          await response.json();


        if (
          typeof data.balance ===
          "number"
        ) {
          balance =
            data.balance;
        }


        if (
          typeof data.energy ===
          "number"
        ) {

    /* NAVIGATION */

    const pages =
      document.querySelectorAll(
        ".page"
      );

    const navButtons =
      document.querySelectorAll(
        ".nav-btn"
      );


    navButtons.forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const pageId =
            button.dataset.page;


          pages.forEach(page => {

            page.classList.toggle(
              "active",
              page.id === pageId
            );

          });


          navButtons.forEach(btn => {

            btn.classList.toggle(
              "active",
              btn === button
            );

          });


          if (pageId === "rankPage") {
            loadRank();
          }

        }
      );

    });


    /* RANK */

    async function loadRank() {

      const list =
        document.getElementById(
          "rankList"
        );


      list.innerHTML =
        "Yuklanmoqda...";


      try {

        const response =
          await fetch(
            "/api/rank"
          );


        if (!response.ok) {

          throw new Error(
            "Rank error"
          );

        }


        const users =
          await response.json();


        list.innerHTML = "";


        if (!users.length) {

          list.innerHTML =
            '<div class="rank-item">Hali reyting yo‘q</div>';

          return;

        }


        users.forEach(
          (user, index) => {

            const row =
              document.createElement(
                "div"
              );

            row.className =
              "rank-item";


            const name =
              user.username ||
              user.firstName ||
              "Player";


            row.innerHTML = `
              <div class="rank-number">
                ${index + 1}
              </div>

              <div class="rank-user">
                ${escapeHtml(name)}
              </div>

              <div class="rank-balance">
                ${formatNumber(user.balance)} 🪙
              </div>
            `;


            list.appendChild(row);

          }
        );


      } catch (error) {

        console.log(
          "Rank:",
          error
        );


        list.innerHTML =
          '<div class="rank-item">Reytingni yuklab bo‘lmadi</div>';

      }

    }

    document
      .getElementById("inviteBtn")

        async () => {

            "https://t.me/UZCOIN_BOT?start=ref_" +

            } else {

              await navigator.clipboard.writeText(
                link
              );

              alert(
                "Referral link nusxalandi"
              );

            }

          } catch (error) {

            console.log(
              "Invite:",
              error
            );

          }

        }
      );


    /* HTML SAFE */

    function escapeHtml(text) {

      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* START */

    loadUser();

  </script>
