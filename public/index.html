<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>UZCOIN</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #10131a;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      width: 100%;
      text-align: center;
      padding-top: 25px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .balance {
      margin-top: 18px;
      font-size: 34px;
      font-weight: bold;
    }

    .level {
      margin-top: 8px;
      font-size: 16px;
      font-weight: bold;
      opacity: 0.85;
    }

    /* =========================
       COIN AREA
    ========================= */

    .coin-area {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-bottom: 25px;
      min-height: 0;
    }

    .coin {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      border: none;
      background: #f5b800;
      box-shadow:
        0 0 0 10px rgba(245, 184, 0, 0.12),
        0 0 50px rgba(245, 184, 0, 0.35);
      font-size: 105px;
      cursor: pointer;
      transition: transform 0.08s;
      user-select: none;
    }

    .coin:active {
      transform: scale(0.92);
    }

    .coin.disabled {
      opacity: 0.45;
      transform: scale(0.95);
    }

    .tap-text {
      margin-top: 18px;
      font-size: 15px;
      opacity: 0.65;
      letter-spacing: 2px;
    }

    .tap-power {
      margin-top: 8px;
      font-size: 15px;
      font-weight: bold;
    }

    .energy {
      margin-top: 10px;
      font-size: 16px;
    }

    /* =========================
       SKIN BUTTON
    ========================= */

    .skin-button {
      margin-top: 16px;
      padding: 12px 24px;
      border: none;
      border-radius: 14px;
      background: #252b36;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .skin-button:active {
      transform: scale(0.96);
    }

    /* =========================
       SKIN PANEL
    ========================= */

    .skin-panel {
      display: none;
      width: 90%;
      max-width: 360px;
      max-height: 280px;
      margin-top: 12px;
      padding: 15px;
      background: #191d26;
      border: 1px solid #292e38;
      border-radius: 18px;

      overflow-y: auto;
      overflow-x: hidden;

      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      overscroll-behavior: contain;
    }

    .skin-panel.show {
      display: block;
    }

    .skin-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .skin-option {
      width: 100%;
      min-height: 58px;
      margin-top: 8px;
      padding: 12px;

      border: none;
      border-radius: 12px;

      background: #252b36;
      color: white;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 15px;
      cursor: pointer;
    }

    .skin-option span {
      font-size: 12px;
      opacity: 0.65;
      text-align: right;
    }

    .skin-option.locked {
      opacity: 0.45;
    }

    .skin-option.selected {
      border: 2px solid white;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      width: 100%;
      height: 82px;
      margin-bottom: 45px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #191d26;
      border: 1px solid #292e38;
      border-radius: 20px;
      padding: 5px 4px;
    }

    .nav-button {
      background: none;
      border: none;
      color: #8e96a3;
      font-size: 12px;
      cursor: pointer;
    }

    .nav-button span {
      display: block;
      font-size: 24px;
      margin-bottom: 3px;
    }

    .nav-button.active {
      color: white;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-height: 700px) {
      .header {
        padding-top: 12px;
      }

      .balance {
        margin-top: 8px;
        font-size: 28px;
      }

      .coin {
        width: 190px;
        height: 190px;
        font-size: 85px;
      }

      .skin-panel {
        max-height: 230px;
      }

      .bottom-nav {
        margin-bottom: 10px;
      }
    }
  </style>
</head>

      <button class="nav-button">

    </div>

  </div>
