<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>UZCOIN</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #07111f;
  color: white;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 18%, rgba(0,180,255,.16), transparent 32%),
    radial-gradient(circle at 10% 90%, rgba(120,0,255,.12), transparent 30%),
    linear-gradient(180deg, #07111f 0%, #030812 100%);
}

/* =========================
   LOADING
========================= */

#loading {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;

  background:
    radial-gradient(circle, #102b49 0%, #030812 65%);
}

.loading-logo {
  font-size: 42px;
  font-weight: 900;
  color: #f5b800;

  text-shadow:
    0 0 15px rgba(245,184,0,.7),
    0 0 35px rgba(245,184,0,.3);

  margin-bottom: 15px;
}

.loading-text {
  font-size: 15px;
  color: #aab8c8;
}

.loading-spinner {
  width: 30px;
  height: 30px;
  border: 3px solid rgba(255,255,255,.15);
  border-top-color: #f5b800;
  border-radius: 50%;
  margin-top: 20px;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.hidden {
  display: none !important;
}

/* =========================
   APP
========================= */

#app {
  width: 100%;
  min-height: 100vh;
  padding-bottom: 85px;
}

/* =========================
   HEADER
========================= */

.header {
  width: 100%;
  padding: 18px 16px 10px;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 1px;

  color: #f5b800;

  text-shadow:
    0 0 12px rgba(245,184,0,.5);
}

.header-level {
  padding: 7px 12px;
  border-radius: 12px;

  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.08);

  font-size: 13px;
  font-weight: bold;
}

/* =========================
   BALANCE
========================= */

.balance-box {
  text-align: center;
  margin-top: 5px;
}

.balance-label {
  color: #8292a6;
  font-size: 13px;
}

.balance {
  margin-top: 4px;

  font-size: 34px;
  font-weight: 900;

  color: #fff;

  text-shadow:
    0 0 20px rgba(255,255,255,.12);
}

/* =========================
   LEVEL PROGRESS
========================= */

.level-progress {
  width: calc(100% - 40px);
  max-width: 500px;

  margin: 12px auto 0;
}

.level-text {
  display: flex;
  justify-content: space-between;

  font-size: 11px;
  color: #8292a6;

  margin-bottom: 5px;
}

.progress-bg {
  width: 100%;
  height: 7px;

  background: rgba(255,255,255,.08);

  border-radius: 20px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;

  border-radius: 20px;

  background: linear-gradient(
    90deg,
    #f5b800,
    #ffdb55
  );

  box-shadow:
    0 0 12px rgba(245,184,0,.45);

  transition: width .25s ease;
}

/* =========================
   HOME
========================= */

.page {
  display: none;
}

.page.active {
  display: block;
}

/* =========================
   ENERGY
========================= */

.energy-box {
  width: calc(100% - 50px);
  max-width: 430px;

  margin: 18px auto 4px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 9px 13px;

  border-radius: 14px;

  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.07);
}

.energy-left {
  display: flex;
  align-items: center;
  gap: 7px;
}

.energy-icon {
  font-size: 18px;
}

.energy-title {
  font-size: 12px;
  color: #8796a9;
}

.energy-value {
  font-size: 15px;
  font-weight: 800;
}

/* =========================
   COIN AREA
========================= */

.coin-area {
  min-height: 350px;

  display: flex;
  align-items: center;
  justify-content: center;

  position: relative;

  overflow: hidden;
}

/* decorative circles */

.coin-area::before {
  content: "";

  position: absolute;

  width: 270px;
  height: 270px;

  border-radius: 50%;

  border: 1px solid rgba(255,255,255,.045);

  box-shadow:
    0 0 70px rgba(0,170,255,.06);

  pointer-events: none;
}

.coin-area::after {
  content: "";

  position: absolute;

  width: 190px;
  height: 190px;

  border-radius: 50%;

  border: 1px dashed rgba(255,255,255,.04);

  animation: rotateCircle 25s linear infinite;

  pointer-events: none;
}

@keyframes rotateCircle {
  to {
    transform: rotate(360deg);
  }
}

/* =========================
   COIN
========================= */

.coin {
  position: relative;

  width: 190px;
  height: 190px;

  border-radius: 50%;

  border: none;

  cursor: pointer;

  user-select: none;
  touch-action: manipulation;

  outline: none;

  transition:
    transform .08s ease,
    filter .2s ease;

  z-index: 5;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow:
    0 18px 45px rgba(0,0,0,.45);
}

.coin:active {
  transform: scale(.91);
}

/* inner coin */

.coin-inner {
  width: 158px;
  height: 158px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  position: relative;

  border: 3px solid rgba(255,255,255,.25);

  overflow: hidden;
}

.coin-inner::before {
  content: "";

  position: absolute;

  inset: 9px;

  border-radius: 50%;

  border: 2px solid rgba(255,255,255,.18);
}

.coin-inner::after {
  content: "";

  position: absolute;

  width: 80px;
  height: 30px;

  top: 22px;
  left: 22px;

  background: rgba(255,255,255,.22);

  border-radius: 50%;

  transform: rotate(-35deg);

  filter: blur(4px);
}

.coin-symbol {
  position: relative;

  z-index: 3;

  font-size: 60px;

  font-weight: 900;

  color: rgba(255,255,255,.9);

  text-shadow:
    2px 3px 0 rgba(0,0,0,.2),
    0 0 15px rgba(255,255,255,.15);
}

/* =========================
   COIN MATERIALS
========================= */

/* CLASSIC / BRONZE */

.coin.skin-classic {
  background:
    radial-gradient(
      circle at 35% 28%,
      #ffe89a 0%,
      #e6a91b 25%,
      #a96708 60%,
      #603300 100%
    );

  box-shadow:
    0 0 0 7px rgba(170,100,10,.15),
    0 0 40px rgba(245,184,0,.35),
    inset 0 0 25px rgba(255,255,255,.25);
}

.coin.skin-classic .coin-inner {
  background:
    repeating-radial-gradient(
      circle,
      rgba(255,255,255,.05) 0 2px,
      rgba(0,0,0,.05) 3px 5px
    ),
    linear-gradient(
      145deg,
      #ffd96a,
      #b8760c
    );
}

/* OCEAN */

.coin.skin-ocean {
  background:
    radial-gradient(
      circle at 30% 25%,
      #b9f4ff,
      #23a8e8 30%,
      #075d9e 65%,
      #032f59
    );

  box-shadow:
    0 0 45px rgba(33,150,243,.45),
    inset 0 0 30px rgba(255,255,255,.2);
}

.coin.skin-ocean .coin-inner {
  background:
    repeating-linear-gradient(
      135deg,
      rgba(255,255,255,.1) 0 3px,
      transparent 3px 9px
    ),
    linear-gradient(
      145deg,
      #68ddff,
      #0868a8
    );
}

/* NEBULA */

.coin.skin-nebula {
  background:
    radial-gradient(
      circle at 35% 25%,
      #f2a5ff,
      #a93bd2 30%,
      #54209a 65%,
      #241044
    );

  box-shadow:
    0 0 55px rgba(156,39,176,.6),
    inset 0 0 30px rgba(255,255,255,.2);
}

.coin.skin-nebula .coin-inner {
  background:
    radial-gradient(circle at 70% 25%, #e9a4ff 0 5%, transparent 6%),
    radial-gradient(circle at 30% 70%, #d15cff 0 4%, transparent 5%),
    linear-gradient(
      145deg,
      #d85df3,
      #5c1d9e
    );
}

/* EMERALD */

.coin.skin-emerald {
  background:
    radial-gradient(
      circle at 32% 24%,
      #baffd5,
      #28c76f 30%,
      #087c43 65%,
      #033b23
    );

  box-shadow:
    0 0 50px rgba(76,175,80,.5),
    inset 0 0 30px rgba(255,255,255,.2);
}

.coin.skin-emerald .coin-inner {
  background:
    linear-gradient(
      135deg,
      #79ffb2,
      #07964e 55%,
      #03582d
    );
}

/* INFERNO */

.coin.skin-inferno {
  background:
    radial-gradient(
      circle at 32% 24%,
      #ffe4b0,
      #ff7b22 25%,
      #e52d16 60%,
      #5d0904
    );

  box-shadow:
    0 0 55px rgba(244,67,54,.55),
    inset 0 0 30px rgba(255,220,100,.2);
}

.coin.skin-inferno .coin-inner {
  background:
    repeating-linear-gradient(
      125deg,
      rgba(255,255,255,.07) 0 4px,
      transparent 4px 10px
    ),
    linear-gradient(
      145deg,
      #ffb23e,
      #d52a12
    );
}

/* CYBER */

.coin.skin-cyber {
  background:
    radial-gradient(
      circle at 30% 24%,
      #d8ffff,
      #00d8ef 28%,
      #00758b 60%,
      #002b35
    );

  box-shadow:
    0 0 55px rgba(0,188,212,.6),
    inset 0 0 30px rgba(255,255,255,.2);
}

.coin.skin-cyber .coin-inner {
  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.07) 0 2px,
      transparent 2px 7px
    ),
    linear-gradient(
      145deg,
      #42f5ff,
      #007d96
    );
}

/* IMMORTAL */

.coin.skin-immortal {
  background:
    radial-gradient(
      circle at 32% 23%,
      #ffffff,
      #c99cff 20%,
      #7137d0 55%,
      #291052
    );

  box-shadow:
    0 0 70px rgba(103,58,183,.75),
    0 0 110px rgba(150,80,255,.25),
    inset 0 0 35px rgba(255,255,255,.25);
}

.coin.skin-immortal .coin-inner {
  background:
    radial-gradient(
      circle at 50% 45%,
      #b977ff,
      #5424a6 65%,
      #28104d
    );
}

/* =========================
   TAP EFFECT
========================= */

.tap-effect {
  position: fixed;

  z-index: 999;

  pointer-events: none;

  font-size: 23px;
  font-weight: 900;

  color: #fff;

  text-shadow:
    0 2px 7px rgba(0,0,0,.8);

  animation: tapFloat .65s ease-out forwards;
}

@keyframes tapFloat {

  0% {
    opacity: 1;
    transform:
      translate(-50%, -50%)
      scale(.8);
  }

  100% {
    opacity: 0;
    transform:
      translate(-50%, -120px)
      scale(1.25);
  }
}

/* =========================
   SKINS PANEL
========================= */

.section {
  width: calc(100% - 24px);
  max-width: 520px;

  margin: 0 auto 20px;
}

.section-title {
  font-size: 17px;
  font-weight: 900;

  margin-bottom: 12px;
}

.skins-panel {
  padding: 12px;

  border-radius: 18px;

  background: rgba(255,255,255,.045);

  border: 1px solid rgba(255,255,255,.07);

  max-height: 420px;
  overflow-y: auto;
}

.skin-option {
  width: 100%;

  min-height: 70px;

  margin-bottom: 8px;

  padding: 10px 12px;

  border: 1px solid rgba(255,255,255,.07);

  border-radius: 14px;

  background: rgba(255,255,255,.045);

  color: white;

  display: flex;
  align-items: center;
  justify-content: space-between;

  text-align: left;

  cursor: pointer;

  transition:
    transform .15s ease,
    background .15s ease,
    border .15s ease;
}

.skin-option:last-child {
  margin-bottom: 0;
}

.skin-option:active {
  transform: scale(.98);
}

.skin-option.selected {
  border-color: rgba(245,184,0,.65);

  background: rgba(245,184,0,.09);

  box-shadow:
    inset 0 0 20px rgba(245,184,0,.04);
}

.skin-option.locked {
  opacity: .38;
}

.skin-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.skin-icon {
  width: 40px;
  height: 40px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,.07);

  font-size: 21px;
}

.skin-name {
  font-weight: 800;
  font-size: 14px;
}

.skin-info {
  color: #8796a9;
  font-size: 11px;
  line-height: 1.45;
  margin-top: 2px;
}

.skin-status {
  font-size: 11px;
  color: #f5b800;
  font-weight: 800;
}

/* =========================
   OTHER PAGES
========================= */

.page-content {
  width: calc(100% - 24px);
  max-width: 520px;

  margin: 20px auto;
}

.page-title {
  font-size: 24px;
  font-weight: 900;

  margin-bottom: 16px;
}

.card {
  padding: 16px;

  margin-bottom: 10px;

  border-radius: 16px;

  background: rgba(255,255,255,.05);

  border: 1px solid rgba(255,255,255,.07);
}

.rank-row {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 13px 5px;

  border-bottom: 1px solid rgba(255,255,255,.06);
}

.rank-row:last-child {
  border-bottom: none;
}

.rank-number {
  width: 35px;
  font-weight: 900;
}

.rank-name {
  flex: 1;
  font-weight: 700;
}

.rank-balance {
  font-weight: 900;
  color: #f5b800;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 500;

  height: 72px;

  padding:
    7px 10px
    calc(7px + env(safe-area-inset-bottom))
    10px;

  background:
    rgba(4,10,18,.94);

  backdrop-filter: blur(16px);

  border-top:
    1px solid rgba(255,255,255,.07);

  display: flex;
  justify-content: space-around;
}

.nav-btn {
  flex: 1;

  border: none;
  background: transparent;

  color: #708095;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 4px;

  font-size: 10px;
  font-weight: 700;

  cursor: pointer;
}

.nav-icon {
  font-size: 21px;
}

.nav-btn.active {
  color: #f5b800;

  text-shadow:
    0 0 10px rgba(245,184,0,.35);
}

/* =========================
   LEVEL POPUP
========================= */

.level-popup {
  position: fixed;
  inset: 0;

  z-index: 3000;

  background: rgba(0,0,0,.7);

  display: none;

  align-items: center;
  justify-content: center;

  padding: 25px;
}

.level-popup.show {
  display: flex;
}

.level-popup-box {
  width: 100%;
  max-width: 350px;

  padding: 28px 20px;

  border-radius: 24px;

  text-align: center;

  background:
    linear-gradient(
      180deg,
      #162a43,
      #091321
    );

  border: 1px solid rgba(245,184,0,.35);

  box-shadow:
    0 20px 70px rgba(0,0,0,.6);
}

.level-popup-icon {
  font-size: 60px;

  margin-bottom: 8px;
}

.level-popup-title {
  font-size: 25px;
  font-weight: 900;

  color: #f5b800;
}

.level-popup-text {
  color: #aab8c8;

  margin-top: 8px;
}

.popup-close {
  width: 100%;

  margin-top: 20px;

  padding: 13px;

  border: none;
  border-radius: 13px;

  background: #f5b800;
  color: #111;

  font-size: 15px;
  font-weight: 900;

  cursor: pointer;
}

/* =========================
   PROFILE
========================= */

.profile-avatar {
  width: 80px;
  height: 80px;

  margin: 0 auto 12px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 35px;

  background:
    linear-gradient(
      135deg,
      #f5b800,
      #754f00
    );

  box-shadow:
    0 0 30px rgba(245,184,0,.25);
}

.profile-name {
  text-align: center;

  font-size: 20px;
  font-weight: 900;
}

.profile-username {
  text-align: center;

  color: #8190a3;

  font-size: 13px;

  margin-top: 4px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 380px) {

  .coin {
    width: 170px;
    height: 170px;
  }

  .coin-inner {
    width: 142px;
    height: 142px;
  }

  .coin-symbol {
    font-size: 52px;
  }

  .coin-area {
    min-height: 315px;
  }

}

</style>
</head>

<body>

<!-- =========================
     LOADING
========================= -->

<div id="loading">

  <div class="loading-logo">
    🪙 UZCOIN
  </div>

  <div class="loading-text">
    UZCOIN yuklanmoqda...
  </div>

  <div class="loading-spinner"></div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app">

  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      UZCOIN
    </div>

    <div class="header-level">
      LEVEL <span id="level">1</span>
    </div>

  </header>


  <!-- =====================
       HOME
  ====================== -->

  <div
    id="homePage"
    class="page active"
  >

    <!-- BALANCE -->

    <div class="balance-box">

      <div class="balance-label">
        BALANCE
      </div>

      <div
        id="balance"
        class="balance"
      >
        0
      </div>

    </div>


    <!-- LEVEL PROGRESS -->

    <div class="level-progress">

      <div class="level-text">

        <span>
          LEVEL <span id="progressLevel">1</span>
        </span>

        <span id="nextLevelText">
          2,000
        </span>

      </div>

      <div class="progress-bg">

        <div
          id="progressFill"
          class="progress-fill"
        ></div>

      </div>

    </div>


    <!-- ENERGY -->

    <div class="energy-box">

      <div class="energy-left">

        <div class="energy-icon">
          ⚡
        </div>

        <div class="energy-title">
          ENERGY
        </div>

      </div>

      <div
        id="energy"
        class="energy-value"
      >
        100 / 100
      </div>

    </div>


    <!-- COIN -->

    <div class="coin-area">

      <button
        id="coin"
        class="coin skin-classic"
        type="button"
      >

        <div class="coin-inner">

          <div
            id="coinSymbol"
            class="coin-symbol"
          >
            UZ
          </div>

        </div>

      </button>

    </div>


    <!-- SKINS -->

    <div class="section">

      <div class="section-title">
        🎨 Skins
      </div>

      <div
        id="skinsPanel"
        class="skins-panel"
      >

        <!-- CLASSIC -->

        <button
          class="skin-option"
          data-skin="classic"
          data-level="1"
        >

          <div class="skin-left">

            <div class="skin-icon">
              🟡
            </div>

            <div>

              <div class="skin-name">
                Classic
              </div>

              <div class="skin-info">
                Level 1<br>
                +1 TAP • 100 ⚡
              </div>

            </div>

          </div>

          <div
            class="skin-status"
            data-status="classic"
          >
            SELECT
          </div>

        </button>


        <!-- OCEAN -->

        <button
          class="skin-option"
          data-skin="ocean"
          data-level="2"
        >

          <div class="skin-left">

            <div class="skin-icon">
              🔵
            </div>

            <div>

              <div class="skin-name">
                Ocean
              </div>

              <div class="skin-info">
                Level 2<br>
                +3 TAP • 200 ⚡
              </div>

            </div>

          </div>

          <div
            class="skin-status"
            data-status="ocean"
          >
            🔒
          </div>

        </button>


        <!-- NEBULA -->

        <button
          class="skin-option"
          data-skin="nebula"
          data-level="3"
        >

          <div class="skin-left">

            <div class="skin-icon">
              🟣
            </div>

            <div>

              <div class="skin-name">
                Nebula
              </div>

              <div class="skin-info">
                Level 3<br>
                +5 TAP • 300 ⚡
              </div>

            </div>

          </div>

          <div
            class="skin-status"
            data-status="nebula"
          >
            🔒
          </div>

        </button>


        <!-- EMERALD -->

        <button
          class="skin-option"
          data-skin="emerald"
          data-level="4"
        >

          <div class="skin-left">

            <div class="skin-icon">
              🟢
            </div>

            <div>

              <div class="skin-name">
                Emerald
              </div>

              <div class="skin-info">
                Level 4<br>
                +8 TAP • 400 ⚡
              </div>

            </div>

          </div>

          <div
            class="skin-status"
            data-status="emerald"
          >

<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg =
  window.Telegram?.WebApp;

if (tg) {

  tg.ready();

  tg.expand();

}


/* =====================================================
   DOM
===================================================== */

const loading =
  document.getElementById("loading");

const coin =
  document.getElementById("coin");

const coinSymbol =
  document.getElementById("coinSymbol");

const balanceEl =
  document.getElementById("balance");

const energyEl =
  document.getElementById("energy");

const levelEl =
  document.getElementById("level");

const progressLevel =
  document.getElementById("progressLevel");

const progressFill =
  document.getElementById("progressFill");

const nextLevelText =
  document.getElementById("nextLevelText");

const rankList =
  document.getElementById("rankList");

const levelPopup =
  document.getElementById("levelPopup");

const popupText =
  document.getElementById("popupText");

const popupIcon =
  document.getElementById("popupIcon");


/* =====================================================
   TELEGRAM USER
===================================================== */

let telegramId = null;

let initData = "";

if (tg && tg.initDataUnsafe) {

  if (tg.initDataUnsafe.user) {

    telegramId =
      String(
        tg.initDataUnsafe.user.id
      );

  }

  initData =
    tg.initData || "";

}


/* =====================================================
   STATE
===================================================== */

let balance = 0;

let level = 1;

let lastLevel = 1;

let energy = 100;

let maxEnergy = 100;

let tapPower = 1;

let selectedSkin = "classic";

let skins = {};

let userData = null;


/* =====================================================
   SKINS
===================================================== */

const SKINS = {

  classic: {
    level: 1,
    power: 1,
    maxEnergy: 100,
    icon: "🟡",
    name: "Classic"
  },

  ocean: {
    level: 2,
    power: 3,
    maxEnergy: 200,
    icon: "🔵",
    name: "Ocean"
  },

  nebula: {
    level: 3,
    power: 5,
    maxEnergy: 300,
    icon: "🟣",
    name: "Nebula"
  },

  emerald: {
    level: 4,
    power: 8,
    maxEnergy: 400,
    icon: "🟢",
    name: "Emerald"
  },

  inferno: {
    level: 5,
    power: 12,
    maxEnergy: 500,
    icon: "🔴",
    name: "Inferno"
  },

  cyber: {
    level: 6,
    power: 16,
    maxEnergy: 600,
    icon: "🔷",
    name: "Cyber"
  },

  immortal: {
    level: 7,
    power: 20,
    maxEnergy: 700,
    icon: "🔮",
    name: "Immortal"
  }

};


/* =====================================================
   LEVELS
===================================================== */

const LEVELS = {

  1: {
    min: 0,
    max: 2000,
    skin: "classic"
  },

  2: {
    min: 2000,
    max: 5000,
    skin: "ocean"
  },

  3: {
    min: 5000,
    max: 10000,
    skin: "nebula"
  },

  4: {
    min: 10000,
    max: 50000,
    skin: "emerald"
  },

  5: {
    min: 50000,
    max: 100000,
    skin: "inferno"
  },

  6: {
    min: 100000,
    max: 1000000,
    skin: "cyber"
  },

  7: {
    min: 1000000,
    max: Infinity,
    skin: "immortal"
  }

};


function getLevelFromBalance(value) {

  const amount =
    Number(value) || 0;

  if (amount >= 1000000)
    return 7;

  if (amount >= 100000)
    return 6;

  if (amount >= 50000)
    return 5;

  if (amount >= 10000)
    return 4;

  if (amount >= 5000)
    return 3;

  if (amount >= 2000)
    return 2;

  return 1;

}


/* =====================================================
   FORMAT
===================================================== */

function formatNumber(value) {

  return Number(value || 0)
    .toLocaleString("en-US");

}


/* =====================================================
   UI
===================================================== */

function updateBalance() {

  balanceEl.textContent =
    formatNumber(balance);

  document.getElementById(
    "profileBalance"
  ).textContent =
    formatNumber(balance);

}


function updateLevelUI() {

  levelEl.textContent =
    level;

  progressLevel.textContent =
    level;

  document.getElementById(
    "profileLevel"
  ).textContent =
    level;

  const current =
    LEVELS[level];

  if (!current) {
    return;
  }

  if (level === 7) {

    progressFill.style.width =
      "100%";

    nextLevelText.textContent =
      "MAX";

    return;
  }

  const progress =
    balance - current.min;

  const needed =
    current.max - current.min;

  let percent =
    (progress / needed) * 100;

  percent =
    Math.max(
      0,
      Math.min(
        100,
        percent
      )
    );

  progressFill.style.width =
    percent + "%";

  nextLevelText.textContent =
    formatNumber(current.max);

}


function updateEnergyUI() {

  energy =
    Math.max(
      0,
      Math.min(
        maxEnergy,
        Math.floor(energy)
      )
    );

  energyEl.textContent =
    `${energy} / ${maxEnergy}`;

}


function updateTapPowerUI() {

  /* tap power is represented by selected skin */
}


/* =====================================================
   COIN DESIGN
===================================================== */

function updateCoinDesign() {

  coin.className =
    "coin skin-" +
    selectedSkin;

  const skin =
    SKINS[selectedSkin];

  if (skin) {

    coinSymbol.textContent =
      selectedSkin === "classic"
        ? "UZ"
        : selectedSkin === "ocean"
        ? "≈"
        : selectedSkin === "nebula"
        ? "✦"
        : selectedSkin === "emerald"
        ? "◆"
        : selectedSkin === "inferno"
        ? "🔥"
        : selectedSkin === "cyber"
        ? "⚡"
        : "♛";

  }

}


/* =====================================================
   SKIN LOCK SYSTEM
===================================================== */

function updateSkinLocks() {

  document
    .querySelectorAll(".skin-option")
    .forEach(button => {

      const skinName =
        button.dataset.skin;

      const requiredLevel =
        Number(
          button.dataset.level
        );

      const unlocked =
        level >= requiredLevel;

      const status =
        button.querySelector(
          "[data-status]"
        );

      button.classList.toggle(
        "locked",
        !unlocked
      );

      button.classList.toggle(
        "selected",
        skinName === selectedSkin
      );

      if (!status) {
        return;
      }

      if (!unlocked) {

        status.textContent =
          "🔒";

      } else if (
        skinName === selectedSkin
      ) {

        status.textContent =
          "✓";

      } else {

        status.textContent =
          "SELECT";

      }

    });

}


/* =====================================================
   LEVEL UP
===================================================== */

function checkLevelUp() {

  const newLevel =
    getLevelFromBalance(balance);

  if (
    newLevel >
    lastLevel
  ) {

    level =
      newLevel;

    showLevelPopup(
      newLevel
    );

  }

  if (
    newLevel !== level
  ) {

    level =
      newLevel;

  }

  lastLevel =
    newLevel;

}


function showLevelPopup(newLevel) {

  popupIcon.textContent =
    SKINS[
      LEVELS[newLevel].skin
    ]?.icon || "⭐";

  popupText.textContent =
    `Tabriklaymiz! Level ${newLevel} ochildi.`;

  levelPopup.classList.add(
    "show"
  );

}


/* =====================================================
   TAP EFFECT
===================================================== */

function showTapEffect(
  power,
  x,
  y
) {

  const effect =
    document.createElement("div");

  effect.className =
    "tap-effect";

  effect.textContent =
    "+" + power;

  effect.style.left =
    x + "px";

  effect.style.top =
    y + "px";

  document.body.appendChild(
    effect
  );

  setTimeout(() => {

    effect.remove();

  }, 700);

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser() {

  try {

    if (!telegramId) {

      loading.querySelector(
        ".loading-text"
      ).textContent =
        "❌ Telegram orqali oching";

      return;

    }

    const response =
      await fetch(
        "/api/user/" +
        telegramId
      );

    if (!response.ok) {

      throw new Error(
        "Server javobi: " +
        response.status
      );

    }

    const data =
      await response.json();

    if (!data.success) {

      throw new Error(
        data.message ||
        "Foydalanuvchi topilmadi"
      );

    }

    userData =
      data.user;

    skins =
      data.skins || {};

    balance =
      Number(
        userData.balance
      ) || 0;

    level =
      getLevelFromBalance(
        balance
      );

    lastLevel =
      level;

    energy =
      Number(
        userData.energy
      );

    maxEnergy =
      Number(
        userData.max_energy
      ) || 100;

    selectedSkin =
      userData.skin ||
      "classic";


    /*
      Serverdagi skin ma'lumotidan
      aniq power/maxEnergy olish.
    */

    const selected =
      skins[selectedSkin] ||
      SKINS[selectedSkin];

    if (selected) {

      tapPower =
        Number(
          selected.power
        ) || 1;

      maxEnergy =
        Number(
          selected.maxEnergy ||
          userData.max_energy
        ) || 100;

    }


    updateCoinDesign();

    updateBalance();

    updateLevelUI();

    updateEnergyUI();

    updateSkinLocks();


    loadProfile(
      userData
    );

    loadFriends(
      userData
    );


    loading.classList.add(
      "hidden"
    );


    /*
      Serverdagi energy bilan
      frontend timerini sinxronlaymiz.
    */

    startEnergyRegeneration();


  } catch (error) {

    console.error(
      "LOAD USER ERROR:",
      error
    );

    loading.querySelector(
      ".loading-text"
    ).textContent =
      "❌ " +
      error.message;

  }

}


/* =====================================================
   ENERGY TIMER
===================================================== */

/*
  MUHIM:
  1 SEKUND = 1 ENERGY.

  Bu timer faqat UI uchun.
  Server ham energy'ni elapsed seconds
  bo'yicha hisoblaydi.
*/

let energyTimer = null;

let lastEnergyTime =
  Date.now();


function startEnergyRegeneration() {

  if (energyTimer) {

    clearInterval(
      energyTimer
    );

  }

  lastEnergyTime =
    Date.now();

  energyTimer =
    setInterval(() => {

      if (
        energy >= maxEnergy
      ) {

        lastEnergyTime =
          Date.now();

        return;

      }

      const now =
        Date.now();

      const elapsed =
        Math.floor(
          (now - lastEnergyTime) /
          1000
        );

      if (
        elapsed <= 0
      ) {

        return;

      }

      energy =
        Math.min(
          maxEnergy,
          energy + elapsed
        );

      lastEnergyTime +=
        elapsed * 1000;

      updateEnergyUI();

    }, 250);

}


/* =====================================================
   FAST TAP QUEUE
===================================================== */

/*
  Tap darhol ekranda ishlaydi.
  Serverga esa ketma-ket yuboriladi.

  Shu sababli:
  - tap sekinlashmaydi
  - response tartibi buzilmaydi
  - energy noto'g'ri sakramaydi
*/

let pendingTaps = 0;

let tapQueueRunning = false;


function queueServerTap() {

  pendingTaps++;

  processTapQueue();

}


async function processTapQueue() {

  if (
    tapQueueRunning
  ) {

    return;

  }

  tapQueueRunning =
    true;


  while (
    pendingTaps > 0
  ) {

    pendingTaps--;

    try {

      const response =
        await fetch(
          "/api/tap",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                telegramId:
                  telegramId,

                initData:
                  initData
              })
          }
        );

      const data =
        await response.json();


      if (
        !data.success
      ) {

        /*
          Server qabul qilmasa,
          optimistik tapni qaytaramiz.
        */

        balance =
          Math.max(
            0,
            balance -
            tapPower
          );

        energy =
          Math.min(
            maxEnergy,
            energy + 1
          );

        updateBalance();

        updateEnergyUI();

        console.log(
          "Server tap xatosi:",
          data.message
        );

        continue;

      }


      /*
        Server tasdiqlagan
        oxirgi holatni olamiz.

        Faqat pending tap qolmaganida
        energy/balance'ni to'liq sync qilamiz.
      */

      if (
        pendingTaps === 0
      ) {

        balance =
          Number(
            data.balance
          );

        maxEnergy =
          Number(
            data.maxEnergy
          ) || maxEnergy;

        level =
          Number(
            data.level
          ) ||
          getLevelFromBalance(
            balance
          );

        tapPower =
          Number(
            data.tapPower
          ) ||
          tapPower;

        /*
          Server energy'si lokal
          qiymatdan keskin past bo'lsa,
          uni to'g'ridan-to'g'ri bosib
          yubormaymiz.

          Bu tez tap paytida
          energy sakrashining oldini oladi.
        */

        const serverEnergy =
          Number(
            data.energy
          );

        if (
          Number.isFinite(
            serverEnergy
          )
        ) {

          energy =
            Math.max(
              0,
              Math.min(
                maxEnergy,
                serverEnergy
              )
            );

          lastEnergyTime =
            Date.now();

        }

        updateBalance();

        updateLevelUI();

        updateEnergyUI();

        updateSkinLocks();

      }

    } catch (error) {

      console.error(
        "TAP SERVER ERROR:",
        error
      );

      /*
        Network xatosida
        tapni qaytaramiz.
      */

      balance =
        Math.max(
          0,
          balance -
          tapPower
        );

      energy =
        Math.min(
          maxEnergy,
          energy + 1
        );

      updateBalance();

      updateEnergyUI();

    }

  }


  tapQueueRunning =
    false;

}


/* =====================================================
   COIN TAP
===================================================== */

coin.addEventListener(
  "click",
  event => {

    if (
      energy <= 0
    ) {

      return;

    }


    /*
      Shu tap uchun
      ayni paytdagi power.
    */

    const currentPower =
      Number(
        tapPower
      ) || 1;


    /*
      DARHOL UI.
    */

    balance +=
      currentPower;

    energy =
      Math.max(
        0,
        energy - 1
      );


    /*
      Timer uchun
      yangi vaqt nuqtasi.
    */

    lastEnergyTime =
      Date.now();


    showTapEffect(
      currentPower,
      event.clientX,
      event.clientY
    );


    updateBalance();

    updateEnergyUI();

    checkLevelUp();

    updateLevelUI();

    updateSkinLocks();


    /*
      Serverga yuborish.
    */

    queueServerTap();

  }
);


/* =====================================================
   SKIN SELECT
===================================================== */

document
  .querySelectorAll(".skin-option")
  .forEach(button => {

    button.addEventListener(
      "click",
      async () => {

        const skinName =
          button.dataset.skin;

        const requiredLevel =
          Number(
            button.dataset.level
          );


        /*
          Eski skinlar ham qoladi.
          Faqat level >= talab qilingan
          bo'lsa tanlanadi.
        */

        if (
          level <
          requiredLevel
        ) {

          return;

        }


        if (
          skinName ===
          selectedSkin
        ) {

          return;

        }


        const oldSkin =
          selectedSkin;

        const oldPower =
          tapPower;

        const oldMaxEnergy =
          maxEnergy;

        const oldEnergy =
          energy;


        /*
          UI'ni darhol almashtiramiz.
        */

        selectedSkin =
          skinName;

        const skin =
          SKINS[skinName];

        tapPower =
          skin.power;

        maxEnergy =
          skin.maxEnergy;

        /*
          Yangi skin tanlanganda
          energy to'liq bo'ladi.
        */

        energy =
          maxEnergy;

        lastEnergyTime =
          Date.now();


        updateCoinDesign();

        updateEnergyUI();

        updateSkinLocks();


        try {

          const response =
            await fetch(
              "/api/skin",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    telegramId:
                      telegramId,

                    skin:
                      skinName,

                    initData:
                      initData
                  })
              }
            );


          const data =
            await response.json();


          if (
            !data.success
          ) {

            throw new Error(
              data.message ||
              "Skin tanlashda xato"
            );

          }


          /*
            Server tasdiqladi.
          */

          selectedSkin =
            skinName;

          tapPower =
            Number(
              data.power ||
              data.tapPower ||
              skin.power
            );

          maxEnergy =
            Number(
              data.maxEnergy ||
              skin.maxEnergy
            );

          /*
            Level 3 = 300,
            Level 4 = 400 va hokazo.
          */

          energy =
            Number(
              data.energy
            );

          if (
            !Number.isFinite(
              energy
            )
          ) {

            energy =
              maxEnergy;

          }

          energy =
            Math.min(
              maxEnergy,
              energy
            );

          lastEnergyTime =
            Date.now();

          updateCoinDesign();

          updateEnergyUI();

          updateSkinLocks();


        } catch (error) {

          console.error(
            "SKIN ERROR:",
            error
          );


          /*
            Eski holatga qaytarish.
          */

          selectedSkin =
            oldSkin;

          tapPower =
            oldPower;

          maxEnergy =
            oldMaxEnergy;

          energy =
            oldEnergy;

          lastEnergyTime =
            Date.now();

    );

document
  .querySelectorAll(".nav-btn")
  .forEach(button => {

    button.addEventListener(
      "click",
      async () => {

        const pageId =
          button.dataset.page;


        document
          .querySelectorAll(".page")
          .forEach(page => {

            page.classList.remove(
              "active"
            );

          });


        const page =
          document.getElementById(
            pageId
          );

        if (page) {

          page.classList.add(
            "active"
          );

        }


        document
          .querySelectorAll(".nav-btn")
          .forEach(btn => {

            btn.classList.remove(
              "active"
            );

        );

          "rankPage"
        ) {

          loadRank();

    );

  });


/* =====================================================
   RANK
===================================================== */

async function loadRank() {

  try {

    const response =
      await fetch(
        "/api/rank"
      );

    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        "Rank yuklanmadi"
      );

    }


    const users =
      data.users ||
      data.rank ||
      [];


    if (
      users.length === 0
    ) {

      rankList.innerHTML =
        "Hozircha rank bo‘sh.";

      return;

    }


    rankList.innerHTML =
      users
        .map(
          (user, index) => {

            const name =
              user.first_name ||
              user.username ||
              "User";

            const userBalance =
              Number(
                user.balance
              ) || 0;

            return `

              <div class="rank-row">

                <div class="rank-number">
                  #${index + 1}
                </div>

                <div class="rank-name">
                  ${escapeHtml(name)}
                </div>

                <div class="rank-balance">
                  ${formatNumber(userBalance)}
                </div>

              </div>

            `;

          }
        )
        .join("");

  } catch (error) {

    console.error(
      "RANK ERROR:",
      error
    );

    rankList.innerHTML =
      "❌ Rank yuklanmadi.";

  }

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

/* =====================================================
   SERVER ENERGY SYNC
===================================================== */

/*
  Serverni har 5 sekund tekshiramiz.

  Lekin pending tap bor paytda
  server energy'si bilan
  local taplarni bosib tashlamaymiz.
*/

setInterval(
  async () => {

    if (
      !telegramId
    ) {

      return;

    }

    if (
      pendingTaps > 0 ||
      tapQueueRunning
    ) {

      return;

    }

    try {

      const response =
        await fetch(
          "/api/user/" +
          telegramId
        );

      const data =
        await response.json();


      if (
        !data.success ||
        !data.user
      ) {

        return;

      }


      const serverUser =
        data.user;


      const serverBalance =
        Number(
          serverUser.balance
        );


      /*
        Balance faqat pending tap
        bo'lmaganda sync qilinadi.
      */

      if (
        Number.isFinite(
          serverBalance
        )
      ) {

        balance =
          serverBalance;

      }


      const serverLevel =
        getLevelFromBalance(
          balance
        );


      if (
        serverLevel >
        level
      ) {

        level =
          serverLevel;

      }


      const serverMax =
        Number(
          serverUser.max_energy
        );


      if (
        Number.isFinite(
          serverMax
        ) &&
        serverMax > 0
      ) {

        maxEnergy =
          serverMax;

      }


      const serverEnergy =
        Number(
          serverUser.energy
        );


      if (
        Number.isFinite(
          serverEnergy
        )
      ) {

        energy =
          Math.max(
            0,
            Math.min(
              maxEnergy,
              serverEnergy
            )
          );

      }


      if (
        serverUser.skin
      ) {

        selectedSkin =
          serverUser.skin;

        const skin =
          SKINS[selectedSkin];

        if (skin) {

          tapPower =
            skin.power;

          /*
            Backend max_energy
            bilan moslashtiramiz.
          */

          if (
            !serverMax ||
            serverMax <= 0
          ) {

            maxEnergy =
              skin.maxEnergy;

          }

        }

      }


      lastEnergyTime =
        Date.now();


      updateBalance();

      updateLevelUI();

      updateEnergyUI();

      updateCoinDesign();

      updateSkinLocks();


    } catch (error) {

      console.log(
        "Energy sync error"
      );

    }

  },
  5000
);
