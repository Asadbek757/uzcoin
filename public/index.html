<!DOCTYPE html>
<html lang="uz">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>UZCOIN</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #10131a;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HEADER */

    .header {
      width: 100%;
      text-align: center;
      padding-top: 25px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .balance {
      margin-top: 18px;
      font-size: 34px;
      font-weight: bold;
    }

    .level {
      margin-top: 8px;
      font-size: 16px;
      font-weight: bold;
      opacity: 0.85;
    }

    /* COIN AREA */

    .coin-area {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-bottom: 20px;
      min-height: 0;
    }

    .coin {
      width: 270px;
      height: 270px;

      border-radius: 50%;
      border: none;

      background: #f5b800;

      box-shadow:
        0 0 0 10px rgba(245, 184, 0, 0.12),
        0 0 50px rgba(245, 184, 0, 0.35);

      font-size: 105px;

      cursor: pointer;
      user-select: none;

      transition: transform 0.08s;
    }

    .coin:active {
      transform: scale(0.92);
    }

    .coin.disabled {
      opacity: 0.45;
    }

    .tap-text {
      margin-top: 18px;
      font-size: 15px;
      opacity: 0.65;
      letter-spacing: 2px;
    }

    .tap-power {
      margin-top: 8px;
      font-size: 15px;
      font-weight: bold;
    }

    .energy {
      margin-top: 10px;
      font-size: 16px;
    }

    /* SKIN BUTTON */

    .skin-button {
      margin-top: 16px;

      padding: 12px 24px;

      border: none;
      border-radius: 14px;

      background: #252b36;
      color: white;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;
    }

    .skin-button:active {
      transform: scale(0.96);
    }

    /* SKIN PANEL */

    .skin-panel {
      display: none;

      width: 90%;
      max-width: 360px;

      height: 260px;

      margin-top: 12px;
      padding: 15px;

      background: #191d26;

      border: 1px solid #292e38;
      border-radius: 18px;

      overflow-y: auto;
      overflow-x: hidden;

      -webkit-overflow-scrolling: touch;

      touch-action: pan-y;

      overscroll-behavior: contain;
    }

    .skin-panel.show {
      display: block;
    }

    .skin-title {
      text-align: center;

      font-size: 18px;
      font-weight: bold;

      margin-bottom: 12px;
    }

    .skin-option {
      width: 100%;

      min-height: 60px;

      margin-top: 8px;
      padding: 12px;

      border: none;
      border-radius: 12px;

      background: #252b36;
      color: white;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 15px;

      cursor: pointer;
    }

    .skin-option.locked {
      opacity: 0.45;
    }

    .skin-option.selected {
      border: 2px solid white;
    }

    .skin-info {
      text-align: right;

      font-size: 12px;

      line-height: 18px;

      opacity: 0.8;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      width: 100%;

      height: 82px;

      margin-bottom: 45px;

      display: flex;
      justify-content: space-around;
      align-items: center;

      background: #191d26;

      border: 1px solid #292e38;

      border-radius: 20px;

      padding: 5px 4px;
    }

    .nav-button {
      background: none;
      border: none;

      color: #8e96a3;

      font-size: 12px;

      cursor: pointer;
    }

    .nav-button span {
      display: block;

      font-size: 24px;

      margin-bottom: 3px;
    }

    .nav-button.active {
      color: white;
    }

    /* SMALL SCREEN */

    @media (max-height: 700px) {

      .header {
        padding-top: 12px;
      }

      .balance {
        margin-top: 8px;
        font-size: 28px;
      }

      .coin {
        width: 220px;
        height: 220px;
        font-size: 82px;
      }

      .skin-panel {
        height: 220px;
      }

      .bottom-nav {
        margin-bottom: 10px;
      }

    }

  </style>

</head>


<body>

  <div class="app">


    <!-- HEADER -->

    <div class="header">

      <div class="logo">
        🪙 UZCOIN
      </div>

      <div
        class="balance"
        id="balance"
      >
        0 🪙
      </div>

      <div
        class="level"
        id="level"
      >
        ⭐ Level 1
      </div>

    </div>


    <!-- COIN -->

    <div class="coin-area">

      <button
        class="coin"
        id="coin"
      >
        🪙
      </button>


      <div class="tap-text">
        TAP TO EARN
      </div>


      <div
        class="tap-power"
        id="tapPower"
      >
        ⚡ +1 TAP
      </div>


      <div
        class="energy"
        id="energy"
      >
        🔋 100 / 100
      </div>


      <!-- SKIN BUTTON -->

      <button
        class="skin-button"
        id="skinButton"
      >
        🎨 Coin Skin
      </button>


      <!-- SKIN PANEL -->

      <div
        class="skin-panel"
        id="skinPanel"
      >

        <div class="skin-title">
          🎨 COIN SKIN
        </div>


        <!-- CLASSIC -->

        <button
          class="skin-option"
          data-level="1"
          data-color="#f5b800"
          data-power="1"
          data-energy="100"
        >

          <div>
            🟡 Classic
          </div>

          <div class="skin-info">
            Level 1<br>
            +1 TAP • 100 ⚡
          </div>

        </button>


        <!-- BLUE -->

        <button
          class="skin-option"
          data-level="2"
          data-color="#2196f3"
          data-power="2"
          data-energy="150"
        >

          <div>
            🔵 Blue
          </div>

          <div class="skin-info">
            Level 2<br>
            +2 TAP • 150 ⚡
          </div>

        </button>


        <!-- PURPLE -->

        <button
          class="skin-option"
          data-level="3"
          data-color="#9c27b0"
          data-power="3"
          data-energy="200"
        >

          <div>
            🟣 Purple
          </div>

          <div class="skin-info">
            Level 3<br>
            +3 TAP • 200 ⚡
          </div>

        </button>


        <!-- RED -->

        <button
          class="skin-option"
          data-level="4"
          data-color="#f44336"
          data-power="5"
          data-energy="300"
        >

          <div>
            🔴 Red
          </div>

          <div class="skin-info">
            Level 4<br>
            +5 TAP • 300 ⚡
          </div>

        </button>


        <!-- GOLD -->

        <button
          class="skin-option"
          data-level="5"
          data-color="#ff9800"
          data-power="8"
          data-energy="400"
        >

          <div>
            🟠 Gold
          </div>

          <div class="skin-info">
            Level 5<br>
            +8 TAP • 400 ⚡
          </div>

        </button>


        <!-- DIAMOND -->

        <button
          class="skin-option"
          data-level="6"
          data-color="#00bcd4"
          data-power="12"
          data-energy="550"
        >

          <div>
            💎 Diamond
          </div>

          <div class="skin-info">
            Level 6<br>
            +12 TAP • 550 ⚡
          </div>

        </button>


        <!-- GALAXY -->

        <button
          class="skin-option"
          data-level="7"
          data-color="#673ab7"
          data-power="20"
          data-energy="700"
        >

          <div>
            🌌 Galaxy
          </div>

          <div class="skin-info">
            Level 7<br>
            +20 TAP • 700 ⚡
          </div>

        </button>


      </div>

    </div>


    <!-- BOTTOM NAV -->

    <div class="bottom-nav">

      <button class="nav-button active">

        <span>🏠</span>

        Home

      </button>


      <button class="nav-button">

        <span>🏆</span>

        Rank

      </button>


      <button class="nav-button">

        <span>👥</span>

        Friends

      </button>


      <button class="nav-button">

        <span>👤</span>

        Profile

      </button>

    </div>


  </div>


  <script>

    // =========================
    // TELEGRAM
    // =========================

    const tg = window.Telegram.WebApp;
    const telegramId = tg.initDataUnsafe?.user?.id;
    if (tg) {

      tg.ready();

      tg.expand();

    }


    // =========================
    // PLAYER DATA
    // =========================

    let balance = 0;

    let serverBalance = 0;

    let level = 1;

    let tapPower = 1;

    let energy = 100;

    let maxEnergy = 100;

    let selectedSkin = "#f5b800";


    // =========================
    // ELEMENTS
    // =========================

    const balanceElement =
      document.getElementById("balance");

    const levelElement =
      document.getElementById("level");

    const energyElement =
      document.getElementById("energy");

    const tapPowerElement =
      document.getElementById("tapPower");

    const coin =
      document.getElementById("coin");

    const skinButton =
      document.getElementById("skinButton");

    const skinPanel =
      document.getElementById("skinPanel");

    const skinOptions =
      document.querySelectorAll(".skin-option");


    // =========================
    // BALANCE
    // =========================

    function showTapEffect(amount, x, y) {
  const effect = document.createElement("div");
  effect.textContent = "+" + amount;
  effect.style.position = "fixed";
  effect.style.left = x + "px";
 effect.style.top = y + "px";
  effect.style.transform = "translate(-50%, -50%)";
  effect.style.fontSize = "42px";
  effect.style.fontWeight = "bold";
  effect.style.color = "white";
  effect.style.zIndex = "9999";
  effect.style.transition = "all 0.7s ease";
  effect.style.opacity = "1";    
  effect.style.pointerEvents = "none";

  document.body.appendChild(effect);
     setTimeout(() => {
  effect.style.transform = "translate(-50%, -100%)";
  effect.style.opacity = "0";
}, 50); 

  setTimeout(() => {
    effect.remove();
  }, 700);
}

    async function loadUserData() {
  const response = await fetch("/api/user/" + telegramId);
  const data = await response.json();

  if (data.user) {
  balance = Number(data.user.balance) || 0;
  energy = Number(data.user.energy);
  maxEnergy = Number(data.user.max_energy) || 100;
  }

  updateBalance();    
  updateLevel();
  updateEnergy();   
}

    function updateBalance() {

      balanceElement.textContent =
        balance.toLocaleString("uz-UZ") +
        " 🪙";

    }


    // =========================
    // LEVEL
    // =========================

    function updateLevel() {

      if (balance >= 1000000) {
  level = 7;
} else if (balance >= 100000) {
  level = 6;
} else if (balance >= 50000) {
  level = 5;
} else if (balance >= 10000) {
  level = 4;
} else if (balance >= 5000) {
  level = 3;
} else if (balance >= 2000) {
  level = 2;
} else {
  level = 1;
}

      if (level > 7) {
        level = 7;
      }

      levelElement.textContent =
        "⭐ Level " + level;

      updateSkinLocks();

    }


    // =========================
    // ENERGY
    // =========================

    function updateEnergy() {

      energyElement.textContent =
        "🔋 " +
        energy +
        " / " +
        maxEnergy;


      if (energy <= 0) {

        coin.classList.add("disabled");

      } else {

        coin.classList.remove("disabled");

      }

    }


    // =========================
    // TAP POWER
    // =========================

    function updateTapPower() {

      tapPowerElement.textContent =
        "⚡ +" +
        tapPower +
        " TAP";

    }


    // =========================
    // SKIN LOCKS
    // =========================

    function updateSkinLocks() {

      skinOptions.forEach((skin) => {

        const requiredLevel =
          Number(skin.dataset.level);


        if (level < requiredLevel) {

          skin.classList.add("locked");

          skin.querySelector(".skin-info").innerHTML =
            "🔒 Level " +
            requiredLevel +
            "<br>+" +
            skin.dataset.power +
            " TAP • " +
            skin.dataset.energy +
            " ⚡";

        }

        else {

          skin.classList.remove("locked");


          if (
            skin.dataset.color ===
            selectedSkin
          ) {

            skin.classList.add("selected");

            skin.querySelector(".skin-info").innerHTML =
              "✅ EQUIPPED<br>+" +
              skin.dataset.power +
              " TAP • " +
              skin.dataset.energy +
              " ⚡";

          }

          else {

            skin.classList.remove("selected");

            skin.querySelector(".skin-info").innerHTML =
              "Level " +
              requiredLevel +
              "<br>+" +
              skin.dataset.power +
              " TAP • " +
              skin.dataset.energy +
              " ⚡";

          }

        }

      });

    }


    // =========================
    // TAP
    // =========================

    coin.addEventListener("click", (event) => {

        if (energy <= 0) {
          return;
        }
        
        showTapEffect(tapPower, event.clientX, event.clientY);

        balance += tapPower;
      fetch("/api/tap", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    telegramId: telegramId,
    amount: tapPower
  })
});

        energy--;


        updateBalance();

        updateLevel();

        updateEnergy();

      }
    );


    // =========================
    // SKIN PANEL
    // =========================

    skinButton.addEventListener(
      "click",
      () => {

        skinPanel.classList.toggle(
          "show"
        );

      }
    );


    // =========================
    // SELECT SKIN
    // =========================

    skinOptions.forEach(
      (skin) => {

        skin.addEventListener(
          "click",
          () => {

            const requiredLevel =
              Number(
                skin.dataset.level
              );


            const color =
              skin.dataset.color;


            const power =
              Number(
                skin.dataset.power
              );


            const newMaxEnergy =
              Number(
                skin.dataset.energy
              );


            if (
              level <
              requiredLevel
            ) {

              alert(
                "🔒 Bu skin uchun Level " +
                requiredLevel +
                " kerak!"
              );

              return;

            }


            selectedSkin =
              color;


            tapPower =
              power;


            maxEnergy =
              newMaxEnergy;


            if (
              energy >
              maxEnergy
            ) {

              energy =
                maxEnergy;

            }


            coin.style.background =
              selectedSkin;


            updateTapPower();

            updateEnergy();

            updateSkinLocks();


            skinPanel.classList.remove(
              "show"
            );

          }
        );

      }
    );


    // =========================
    // ENERGY REGENERATION
    // =========================

    setInterval(
      () => {

        if (
          energy <
          maxEnergy
        ) {

          energy++;

          updateEnergy();

        }

      },
      1000
    );


    // =========================
    // START
    // =========================

    updateBalance();

    loadUserData();

    updateLevel();

    updateTapPower();

    updateEnergy();

    updateSkinLocks();


  </script>

</body>
</html>
