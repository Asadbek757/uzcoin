<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>UZCOIN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #10131a;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      width: 100%;
      text-align: center;
      padding-top: 25px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .balance {
      margin-top: 18px;
      font-size: 34px;
      font-weight: bold;
    }
  
    .level {
  margin-top: 8px;
  font-size: 16px;
  font-weight: bold;
  opacity: 0.85;
}
    .coin-area {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-bottom: 25px;
    }

    .coin {
      width: 230px;
      height: 230px;
      border-radius: 50%;
      border: none;
      background: #f5b800;
      box-shadow:
        0 0 0 10px rgba(245, 184, 0, 0.12),
        0 0 50px rgba(245, 184, 0, 0.35);
      font-size: 105px;
      cursor: pointer;
      transition: transform 0.08s;
      user-select: none;
    }

    .coin:active {
      transform: scale(0.92);
    }

    .coin.disabled {
      opacity: 0.45;
      transform: scale(0.95);
    }

    .tap-text {
      margin-top: 18px;
      font-size: 15px;
      opacity: 0.65;
      letter-spacing: 2px;
    }

    .energy {
      margin-top: 15px;
      font-size: 16px;
    }
.bottom-nav {
  width: 100%;
  height: 82px;
  margin-bottom: 45px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: #191d26;
  border: 1px solid #292e38;
  border-radius: 20px;
  padding: 5px 4px;
}

    .nav-button {
      background: none;
      border: none;
      color: #8e96a3;
      font-size: 12px;
      cursor: pointer;
    }

    .nav-button span {
      display: block;
      font-size: 24px;
      margin-bottom: 3px;
    }

    .nav-button.active {
      color: white;
    }
    .skin-button {
  margin-top: 18px;
  padding: 12px 24px;
  border: none;
  border-radius: 14px;
  background: #252b36;
  color: white;
  font-size: 15px;
  font-weight: bold;
}

.skin-panel {
  display: none;
  width: 90%;
  max-width: 360px;
  margin-top: 12px;
  padding: 15px;
  background: #191d26;
  border: 1px solid #292e38;
  border-radius: 18px;
}

.skin-panel.show {
  display: block;
}

.skin-title {
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 12px;
}

.skin-option {
  width: 100%;
  margin-top: 8px;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: #252b36;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
}

.skin-option span {
  font-size: 12px;
  opacity: 0.65;
}
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="logo">🪙 UZCOIN</div>
      <div class="balance" id="balance">0 🪙</div>
    </div>
    <div class="level" id="level">⭐ Level 1</div>

    <div class="coin-area">

      <button class="coin" id="coin">🪙</button>

      <div class="tap-text">TAP TO EARN</div>
      <button class="skin-button" id="skinButton">🎨 Coin Skin</button>

<div class="skin-panel" id="skinPanel">

  <div class="skin-title">🎨 COIN SKIN</div>

  <button class="skin-option" data-level="1" data-color="#f5b800">
    🟡 Gold
    <span>Level 1</span>
  </button>

  <button class="skin-option" data-level="5" data-color="#2196f3">
    🔵 Blue
    <span>Level 5</span>
  </button>

  <button class="skin-option" data-level="10" data-color="#9c27b0">
    🟣 Purple
    <span>Level 10</span>
  </button>

  <button class="skin-option" data-level="15" data-color="#f44336">
    🔴 Red
    <span>Level 15</span>
  </button>

  <button class="skin-option" data-level="20" data-color="#222222">
    ⚫ Black
    <span>Level 20</span>
  </button>

</div>

      <div class="energy" id="energy">⚡ 100 / 100</div>

    </div>

    <div class="bottom-nav">

      <button class="nav-button active">
        <span>🏠</span>
        Home
      </button>

      <button class="nav-button">
        <span>🏆</span>
        Rank
      </button>

      <button class="nav-button">
        <span>👥</span>
        Friends
      </button>

      <button class="nav-button">
        <span>👤</span>
        Profile
      </button>

    </div>

  </div>

  <script>
    
let balance = 0;
let energy = 100;
let level = 1;
    let selectedSkin = "#f5b800";

const skinButton = document.getElementById("skinButton");
const skinPanel = document.getElementById("skinPanel");
const skinOptions = document.querySelectorAll(".skin-option");
    skinButton.addEventListener("click", () => {
  
    function updateLevel() {
  level = Math.floor(balance / 100) + 1;
  document.getElementById("level").textContent = "⭐ Level " + level;
}
    const maxEnergy = 100;

    const balanceElement = document.getElementById("balance");
    const energyElement = document.getElementById("energy");
    const coin = document.getElementById("coin");
      const skinButton = document.getElementById("skinButton");
const skinPanel = document.getElementById("skinPanel");
const skinOptions = document.querySelectorAll(".skin-option");

skinButton.addEventListener("click", () => {
  skinPanel.classList.toggle("show");
});

skinOptions.forEach((skin) => {
  skin.addEventListener("click", () => {
    const requiredLevel = Number(skin.dataset.level);
    const color = skin.dataset.color;

    if (level < requiredLevel) {
      alert("🔒 Bu skin uchun Level " + requiredLevel + " kerak!");
      return;
    }

    selectedSkin = color;
    coin.style.background = selectedSkin;
    skinPanel.classList.remove("show");
  });
});

    function updateEnergy() {
      energyElement.textContent = "⚡ " + energy + " / " + maxEnergy;

      if (energy <= 0) {
        coin.classList.add("disabled");
      } else {
        coin.classList.remove("disabled");
      }
    }

    coin.addEventListener("click", () => {

      if (energy <= 0) {
        return;
      }

      balance++;
      energy--;
      updateLevel();

      balanceElement.textContent =
        balance.toLocaleString("uz-UZ") + " 🪙";

      updateEnergy();
    });

    setInterval(() => {

      if (energy < maxEnergy) {
        energy++;
        updateEnergy();
      }

    }, 1000);

    updateEnergy();
  </script>

</body>
</html>
