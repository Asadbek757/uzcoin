<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>UZCOIN</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #07111f;
  color: white;
  overflow-x: hidden;
}

body {
  min-height: 100vh;

  background:
    radial-gradient(
      circle at 50% 18%,
      rgba(0,180,255,.14),
      transparent 32%
    ),
    radial-gradient(
      circle at 10% 90%,
      rgba(120,0,255,.10),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #07111f 0%,
      #030812 100%
    );
}

button {
  font-family: inherit;
}

.hidden {
  display: none !important;
}


/* =====================================================
   LOADING
===================================================== */

#loading {
  position: fixed;
  inset: 0;
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;

  background:
    radial-gradient(
      circle,
      #102b49 0%,
      #030812 65%
    );
}

.loading-logo {
  font-size: 42px;
  font-weight: 900;

  color: #f5b800;

  text-shadow:
    0 0 15px rgba(245,184,0,.7),
    0 0 35px rgba(245,184,0,.3);

  margin-bottom: 15px;
}

.loading-text {
  font-size: 15px;
  color: #aab8c8;
}

.loading-spinner {
  width: 30px;
  height: 30px;

  border: 3px solid rgba(255,255,255,.15);
  border-top-color: #f5b800;

  border-radius: 50%;

  margin-top: 20px;

  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}


/* =====================================================
   APP
===================================================== */

#app {
  width: 100%;
  min-height: 100vh;
  padding-bottom: 85px;
}


/* =====================================================
   HEADER
===================================================== */

.header {
  width: 100%;
  padding: 18px 16px 10px;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 1px;

  color: #f5b800;

  text-shadow:
    0 0 12px rgba(245,184,0,.5);
}

.header-level {
  padding: 7px 12px;

  border-radius: 12px;

  background: rgba(255,255,255,.07);

  border: 1px solid rgba(255,255,255,.08);

  font-size: 13px;
  font-weight: bold;
}


/* =====================================================
   BALANCE
===================================================== */

.balance-box {
  text-align: center;
  margin-top: 5px;
}

.balance-label {
  color: #8292a6;
  font-size: 13px;
}

.balance {
  margin-top: 4px;

  font-size: 34px;
  font-weight: 900;

  color: #fff;

  text-shadow:
    0 0 20px rgba(255,255,255,.12);
}


/* =====================================================
   LEVEL
===================================================== */

.level-progress {
  width: calc(100% - 40px);
  max-width: 500px;

  margin: 12px auto 0;
}

.level-text {
  display: flex;
  justify-content: space-between;

  font-size: 11px;
  color: #8292a6;

  margin-bottom: 5px;
}

.progress-bg {
  width: 100%;
  height: 7px;

  background: rgba(255,255,255,.08);

  border-radius: 20px;

  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;

  border-radius: 20px;

  background:
    linear-gradient(
      90deg,
      #f5b800,
      #ffdb55
    );

  box-shadow:
    0 0 12px rgba(245,184,0,.45);

  transition:
    width .25s ease;
}


/* =====================================================
   PAGES
===================================================== */

.page {
  display: none;
}

.page.active {
  display: block;
}


/* =====================================================
   ENERGY
===================================================== */

.energy-box {
  width: calc(100% - 50px);
  max-width: 430px;

  margin: 18px auto 4px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 9px 13px;

  border-radius: 14px;

  background: rgba(255,255,255,.055);

  border: 1px solid rgba(255,255,255,.07);
}

.energy-left {
  display: flex;
  align-items: center;
  gap: 7px;
}

.energy-icon {
  font-size: 18px;
}

.energy-title {
  font-size: 12px;
  color: #8796a9;
}

.energy-value {
  font-size: 15px;
  font-weight: 800;
}


/* =====================================================
   COIN AREA
===================================================== */

.coin-area {
  min-height: 350px;

  display: flex;
  align-items: center;
  justify-content: center;

  position: relative;

  overflow: hidden;

  isolation: isolate;
}

/* Large soft halo */

.coin-area::before {
  content: "";

  position: absolute;

  width: 285px;
  height: 285px;

  border-radius: 50%;

  border: 1px solid rgba(255,255,255,.045);

  box-shadow:
    0 0 70px rgba(0,170,255,.06),
    inset 0 0 60px rgba(255,255,255,.025);

  pointer-events: none;
}

/* rotating ring */

.coin-area::after {
  content: "";

  position: absolute;

  width: 245px;
  height: 245px;

  border-radius: 50%;

  border:
    1px dashed
    rgba(255,255,255,.045);

  animation:
    rotateCircle 25s linear infinite;

  pointer-events: none;
}

@keyframes rotateCircle {
  to {
    transform: rotate(360deg);
  }
}


/* =====================================================
   MAIN COIN
===================================================== */

.coin {
  position: relative;

  width: 200px;
  height: 200px;

  padding: 0;

  border: 0;

  border-radius: 50%;

  cursor: pointer;

  user-select: none;
  touch-action: manipulation;

  outline: none;

  z-index: 5;

  display: flex;
  align-items: center;
  justify-content: center;

  transition:
    transform .08s ease,
    filter .2s ease;

  animation:
    coinFloat 3.5s ease-in-out infinite;
}

.coin:active {
  transform: scale(.90);
}

@keyframes coinFloat {

  0%,
  100% {
    translate: 0 0;
  }

  50% {
    translate: 0 -3px;
  }
}


/* Outer metallic rim */

.coin::before {
  content: "";

  position: absolute;

  inset: -2px;

  border-radius: 50%;

  background:
    conic-gradient(
      from 0deg,
      rgba(255,255,255,.75),
      transparent 12%,
      rgba(0,0,0,.45) 25%,
      rgba(255,255,255,.55) 39%,
      rgba(0,0,0,.45) 53%,
      rgba(255,255,255,.55) 68%,
      rgba(0,0,0,.35) 82%,
      rgba(255,255,255,.7)
    );

  z-index: -1;

  opacity: .75;
}


/* Coin shadow */

.coin::after {
  content: "";

  position: absolute;

  width: 150px;
  height: 24px;

  left: 25px;
  bottom: -20px;

  border-radius: 50%;

  background: rgba(0,0,0,.55);

  filter: blur(13px);

  z-index: -2;
}


/* =====================================================
   INNER COIN
===================================================== */

.coin-inner {
  width: 174px;
  height: 174px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  position: relative;

  overflow: hidden;

  border: 3px solid rgba(255,255,255,.30);

  box-shadow:
    inset 0 0 0 4px rgba(0,0,0,.16),
    inset 0 0 28px rgba(0,0,0,.32),
    0 4px 8px rgba(0,0,0,.28);
}


/* inner circular engraved line */

.coin-inner::before {
  content: "";

  position: absolute;

  inset: 10px;

  border-radius: 50%;

  border:
    2px solid
    rgba(255,255,255,.20);

  box-shadow:
    inset 0 0 0 1px
    rgba(0,0,0,.15);
}


/* metallic reflection */

.coin-inner::after {
  content: "";

  position: absolute;

  width: 105px;
  height: 34px;

  top: 17px;
  left: 28px;

  border-radius: 50%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.38),
      transparent
    );

  transform:
    rotate(-35deg);

  filter: blur(4px);

  z-index: 5;

  pointer-events: none;
}


/* =====================================================
   UZCOIN SYMBOL
===================================================== */

.coin-symbol {
  position: relative;

  z-index: 4;

  width: 94px;
  height: 94px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  font-size: 47px;
  font-weight: 1000;

  letter-spacing: -4px;

  color: rgba(255,255,255,.94);

  text-shadow:
    2px 3px 0 rgba(0,0,0,.25),
    0 0 12px rgba(255,255,255,.20);

  filter:
    drop-shadow(0 3px 2px rgba(0,0,0,.35));

  transition:
    transform .2s ease,
    font-size .2s ease;
}


/* =====================================================
   CLASSIC
===================================================== */

.coin.skin-classic {

  background:
    radial-gradient(
      circle at 32% 23%,
      #fff5bf 0%,
      #ffd95a 12%,
      #e5a817 35%,
      #9a5b07 68%,
      #4d2700 100%
    );

  box-shadow:
    0 0 0 6px rgba(175,105,10,.13),
    0 16px 50px rgba(0,0,0,.55),
    0 0 55px rgba(245,184,0,.30),
    inset 0 0 30px rgba(255,255,255,.25);
}

.coin.skin-classic .coin-inner {

  background:
    repeating-radial-gradient(
      circle,
      rgba(255,255,255,.045) 0 2px,
      rgba(0,0,0,.045) 3px 5px
    ),
    linear-gradient(
      145deg,
      #ffe58a,
      #d79719 45%,
      #8a4e05
    );
}

.coin.skin-classic .coin-symbol {
  color: #fff4c4;
}


/* =====================================================
   OCEAN
===================================================== */

.coin.skin-ocean {

  background:
    radial-gradient(
      circle at 30% 22%,
      #d9fbff 0%,
      #7ceaff 13%,
      #25b9ee 35%,
      #07679f 68%,
      #022c52 100%
    );

  box-shadow:
    0 0 0 6px rgba(20,135,205,.13),
    0 16px 50px rgba(0,0,0,.55),
    0 0 55px rgba(0,170,255,.40),
    inset 0 0 30px rgba(255,255,255,.25);
}

.coin.skin-ocean .coin-inner {

  background:
    repeating-linear-gradient(
      135deg,
      rgba(255,255,255,.10) 0 2px,
      transparent 2px 8px
    ),
    linear-gradient(
      145deg,
      #73e9ff,
      #087dbb 50%,
      #034b76
    );
}

.coin.skin-ocean .coin-symbol {
  color: #e9fdff;
  font-size: 58px;
  letter-spacing: 0;
}


/* =====================================================
   NEBULA
===================================================== */

.coin.skin-nebula {

  background:
    radial-gradient(
      circle at 28% 20%,
      #ffd9ff 0%,
      #e99aff 14%,
      #b641df 36%,
      #6620a8 68%,
      #250b47 100%
    );

  box-shadow:
    0 0 0 6px rgba(145,50,205,.13),
    0 16px 50px rgba(0,0,0,.55),
    0 0 65px rgba(177,58,255,.55),
    inset 0 0 30px rgba(255,255,255,.24);
}

.coin.skin-nebula .coin-inner {

  background:
    radial-gradient(
      circle at 72% 28%,
      #fff 0 1.5%,
      transparent 2%
    ),
    radial-gradient(
      circle at 28% 68%,
      #f6b8ff 0 2%,
      transparent 2.5%
    ),
    radial-gradient(
      circle at 65% 72%,
      #8e55ff 0 1.5%,
      transparent 2%
    ),
    linear-gradient(
      145deg,
      #d86bf5,
      #7022b4 55%,
      #32105d
    );
}

.coin.skin-nebula .coin-symbol {
  color: #ffe9ff;
  font-size: 55px;
  letter-spacing: 0;
}


/* =====================================================
   EMERALD
===================================================== */

.coin.skin-emerald {

  background:
    radial-gradient(
      circle at 30% 20%,
      #e0ffe9 0%,
      #75ffb1 14%,
      #20bd68 36%,
      #087b40 68%,
      #022f1c 100%
    );

  box-shadow:
    0 0 0 6px rgba(20,155,80,.14),
    0 16px 50px rgba(0,0,0,.55),
    0 0 65px rgba(0,220,110,.38),
    inset 0 0 30px rgba(255,255,255,.22);
}

.coin.skin-emerald .coin-inner {

  background:
    linear-gradient(
      135deg,
      #9affc2 0%,
      #29d779 28%,
      #078e48 60%,
      #034d29 100%
    );

  clip-path: circle(50%);
}

.coin.skin-emerald .coin-symbol {
  color: #e9fff2;
  font-size: 54px;
  letter-spacing: 0;
}


/* =====================================================
   INFERNO
===================================================== */

.coin.skin-inferno {

  background:
    radial-gradient(
      circle at 30% 20%,
      #fff4c7 0%,
      #ffc14b 13%,
      #ff681f 35%,
      #d92812 65%,
      #560703 100%
    );

  box-shadow:
    0 0 0 6px rgba(220,50,10,.15),
    0 16px 50px rgba(0,0,0,.55),
    0 0 70px rgba(255,60,20,.48),
    inset 0 0 30px rgba(255,230,130,.24);
}

.coin.skin-inferno .coin-inner {

  background:
    repeating-linear-gradient(
      125deg,
      rgba(255,255,255,.08) 0 4px,
      transparent 4px 11px
    ),
    linear-gradient(
      145deg,
      #ffcf58,
      #f04a16 48%,
      #9e1207
    );
}

.coin.skin-inferno .coin-symbol {
  color: #fff1c9;
  font-size: 51px;
  letter-spacing: 0;
}


/* =====================================================
   CYBER
===================================================== */

.coin.skin-cyber {

  background:
    radial-gradient(
      circle at 30% 20%,
      #efffff 0%,
      #79faff 12%,
      #00d9ed 35%,
      #007a8d 65%,
      #002b35 100%
    );

  box-shadow:
    0 0 0 6px rgba(0,225,245,.15),
    0 16px 50px rgba(0,0,0,.55),
    0 0 75px rgba(0,225,255,.60),
    inset 0 0 35px rgba(255,255,255,.24);
}

.coin.skin-cyber .coin-inner {

  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,.09) 0 1px,
      transparent 1px 7px
    ),
    repeating-linear-gradient(
      0deg,
      rgba(0,255,255,.07) 0 1px,
      transparent 1px 8px
    ),
    linear-gradient(
      145deg,
      #45f6ff,
      #008ca2 55%,
      #004652
    );
}

.coin.skin-cyber .coin-symbol {
  color: #eaffff;
  font-size: 55px;
  letter-spacing: 0;

  text-shadow:
    0 0 8px #00ffff,
    0 0 18px rgba(0,255,255,.65);
}


/* =====================================================
   IMMORTAL
===================================================== */

.coin.skin-immortal {

  background:
    radial-gradient(
      circle at 30% 18%,
      #ffffff 0%,
      #fff3b0 10%,
      #ffd447 25%,
      #d99b16 46%,
      #8a5800 72%,
      #3d2100 100%
    );

  box-shadow:
    0 0 0 7px rgba(255,210,70,.16),
    0 16px 55px rgba(0,0,0,.58),
    0 0 80px rgba(255,190,30,.62),
    0 0 120px rgba(255,210,80,.18),
    inset 0 0 38px rgba(255,255,255,.30);
}

.coin.skin-immortal .coin-inner {

  background:
    radial-gradient(
      circle at 50% 30%,
      #fff1a1,
      #e5a928 38%,
      #8c5604 75%,
      #3b2100
    );
}

.coin.skin-immortal .coin-symbol {

  color: #fff6c7;

  font-size: 56px;

  letter-spacing: 0;

  text-shadow:
    2px 3px 0 rgba(75,40,0,.45),
    0 0 10px rgba(255,235,130,.8),
    0 0 25px rgba(255,190,30,.65);
}


/* =====================================================
   TAP EFFECT
===================================================== */

.tap-effect {
  position: fixed;

  z-index: 999;

  pointer-events: none;

  font-size: 23px;
  font-weight: 900;

  color: #fff;

  text-shadow:
    0 2px 7px rgba(0,0,0,.8);

  animation:
    tapFloat .65s ease-out forwards;
}

@keyframes tapFloat {

  0% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(.8);
  }

  100% {
    opacity: 0;

    transform:
      translate(-50%, -120px)
      scale(1.25);
  }
}


/* =====================================================
   SKINS
===================================================== */

.section {
  width: calc(100% - 24px);
  max-width: 520px;

  margin: 0 auto 20px;
}

.section-title {
  font-size: 17px;
  font-weight: 900;

  margin-bottom: 12px;
}

.skins-panel {
  padding: 12px;

  border-radius: 18px;

  background: rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.07);

  max-height: 420px;

  overflow-y: auto;
}

.skin-option {
  width: 100%;

  min-height: 70px;

  margin-bottom: 8px;

  padding: 10px 12px;

  border:
    1px solid
    rgba(255,255,255,.07);

  border-radius: 14px;

  background: rgba(255,255,255,.045);

  color: white;

  display: flex;
  align-items: center;
  justify-content: space-between;

  text-align: left;

  cursor: pointer;

  transition:
    transform .15s ease,
    background .15s ease,
    border .15s ease;
}

.skin-option:last-child {
  margin-bottom: 0;
}

.skin-option:active {
  transform: scale(.98);
}

.skin-option.selected {
  border-color:
    rgba(245,184,0,.65);

  background:
    rgba(245,184,0,.09);

  box-shadow:
    inset 0 0 20px
    rgba(245,184,0,.04);
}

.skin-option.locked {
  opacity: .38;
}

.skin-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.skin-icon {
  width: 40px;
  height: 40px;

  flex-shrink: 0;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,.07);

  font-size: 21px;
}

.skin-name {
  font-weight: 800;
  font-size: 14px;
}

.skin-info {
  color: #8796a9;

  font-size: 11px;

  line-height: 1.45;

  margin-top: 2px;
}

.skin-status {
  font-size: 11px;

  color: #f5b800;

  font-weight: 800;
}


/* =====================================================
   OTHER PAGES
===================================================== */

.page-content {
  width: calc(100% - 24px);
  max-width: 520px;

  margin: 20px auto;
}

.page-title {
  font-size: 24px;
  font-weight: 900;

  margin-bottom: 16px;
}

.card {
  padding: 16px;

  margin-bottom: 10px;

  border-radius: 16px;

  background: rgba(255,255,255,.05);

  border:
    1px solid
    rgba(255,255,255,.07);
}

.rank-row {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 13px 5px;

  border-bottom:
    1px solid
    rgba(255,255,255,.06);
}

.rank-row:last-child {
  border-bottom: none;
}

.rank-number {
  width: 35px;
  font-weight: 900;
}

.rank-name {
  flex: 1;
  font-weight: 700;
}

.rank-balance {
  font-weight: 900;
  color: #f5b800;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 500;

  height: 72px;

  padding:
    7px 10px
    calc(7px + env(safe-area-inset-bottom))
    10px;

  background:
    rgba(4,10,18,.94);

  backdrop-filter: blur(16px);

  border-top:
    1px solid
    rgba(255,255,255,.07);

  display: flex;

  justify-content: space-around;
}

.nav-btn {
  flex: 1;

  border: none;

  background: transparent;

  color: #708095;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 4px;

  font-size: 10px;

  font-weight: 700;

  cursor: pointer;
}

.nav-icon {
  font-size: 21px;
}

.nav-btn.active {
  color: #f5b800;

  text-shadow:
    0 0 10px
    rgba(245,184,0,.35);
}


/* =====================================================
   LEVEL POPUP
===================================================== */

.level-popup {
  position: fixed;

  inset: 0;

  z-index: 3000;

  background:
    rgba(0,0,0,.7);

  display: none;

  align-items: center;

  justify-content: center;

  padding: 25px;
}

.level-popup.show {
  display: flex;
}

.level-popup-box {
  width: 100%;
  max-width: 350px;

  padding: 28px 20px;

  border-radius: 24px;

  text-align: center;

  background:
    linear-gradient(
      180deg,
      #162a43,
      #091321
    );

  border:
    1px solid
    rgba(245,184,0,.35);

  box-shadow:
    0 20px 70px
    rgba(0,0,0,.6);
}

.level-popup-icon {
  font-size: 60px;

  margin-bottom: 8px;
}

.level-popup-title {
  font-size: 25px;

  font-weight: 900;

  color: #f5b800;
}

.level-popup-text {
  color: #aab8c8;

  margin-top: 8px;
}

.popup-close {
  width: 100%;

  margin-top: 20px;

  padding: 13px;

  border: none;

  border-radius: 13px;

  background: #f5b800;

  color: #111;

  font-size: 15px;

  font-weight: 900;

  cursor: pointer;
}


/* =====================================================
   PROFILE
===================================================== */

.profile-avatar {
  width: 80px;
  height: 80px;

  margin: 0 auto 12px;

<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}


/* =====================================================
   DOM
===================================================== */

const loading =
  document.getElementById("loading");

const coin =
  document.getElementById("coin");

const coinSymbol =
  document.getElementById("coinSymbol");

const balanceEl =
  document.getElementById("balance");

const energyEl =
  document.getElementById("energy");

const levelEl =
  document.getElementById("level");

const progressLevel =
  document.getElementById("progressLevel");

const progressFill =
  document.getElementById("progressFill");

const nextLevelText =
  document.getElementById("nextLevelText");

const rankList =
  document.getElementById("rankList");

const levelPopup =
  document.getElementById("levelPopup");

const popupText =
  document.getElementById("popupText");

const popupIcon =
  document.getElementById("popupIcon");


/* =====================================================
   TELEGRAM USER
===================================================== */

let telegramId = null;
let initData = "";

if (tg && tg.initDataUnsafe) {

  if (tg.initDataUnsafe.user) {

    telegramId =
      String(
        tg.initDataUnsafe.user.id
      );

  }

  initData =
    tg.initData || "";
}


/* =====================================================
   STATE
===================================================== */

let balance = 0;
let level = 1;
let lastLevel = 1;

let energy = 100;
let maxEnergy = 100;

let tapPower = 1;

let selectedSkin = "classic";

let skins = {};
let userData = null;


/* =====================================================
   SKINS
===================================================== */

const SKINS = {

  classic: {
    level: 1,
    power: 1,
    maxEnergy: 100,
    icon: "🟡",
    name: "Classic"
  },

  ocean: {
    level: 2,
    power: 3,
    maxEnergy: 200,
    icon: "🔵",
    name: "Ocean"
  },

  nebula: {
    level: 3,
    power: 5,
    maxEnergy: 300,
    icon: "🟣",
    name: "Nebula"
  },

  emerald: {
    level: 4,
    power: 8,
    maxEnergy: 400,
    icon: "🟢",
    name: "Emerald"
  },

  inferno: {
    level: 5,
    power: 12,
    maxEnergy: 500,
    icon: "🔴",
    name: "Inferno"
  },

  cyber: {
    level: 6,
    power: 16,
    maxEnergy: 600,
    icon: "🔷",
    name: "Cyber"
  },

  immortal: {
    level: 7,
    power: 20,
    maxEnergy: 700,
    icon: "👑",
    name: "Immortal"
  }

};


/* =====================================================
   LEVELS
===================================================== */

const LEVELS = {

  1: {
    min: 0,
    max: 2000,
    skin: "classic"
  },

  2: {
    min: 2000,
    max: 5000,
    skin: "ocean"
  },

  3: {
    min: 5000,
    max: 10000,
    skin: "nebula"
  },

  4: {
    min: 10000,
    max: 50000,
    skin: "emerald"
  },

  5: {
    min: 50000,
    max: 100000,
    skin: "inferno"
  },

  6: {
    min: 100000,
    max: 1000000,
    skin: "cyber"
  },

  7: {
    min: 1000000,
    max: Infinity,
    skin: "immortal"
  }

};


function getLevelFromBalance(value) {

  const amount =
    Number(value) || 0;

  if (amount >= 1000000)
    return 7;

  if (amount >= 100000)
    return 6;

  if (amount >= 50000)
    return 5;

  if (amount >= 10000)
    return 4;

  if (amount >= 5000)
    return 3;

  if (amount >= 2000)
    return 2;

  return 1;
}


/* =====================================================
   FORMAT
===================================================== */

function formatNumber(value) {

  return Number(value || 0)
    .toLocaleString("en-US");

}


/* =====================================================
   UI
===================================================== */

function updateBalance() {

  balanceEl.textContent =
    formatNumber(balance);

  document.getElementById(
    "profileBalance"
  ).textContent =
    formatNumber(balance);

}


function updateLevelUI() {

  levelEl.textContent =
    level;

  progressLevel.textContent =
    level;

  document.getElementById(
    "profileLevel"
  ).textContent =
    level;

  const current =
    LEVELS[level];

  if (!current) {
    return;
  }

  if (level === 7) {

    progressFill.style.width =
      "100%";

    nextLevelText.textContent =
      "MAX";

    return;
  }

  const progress =
    balance - current.min;

  const needed =
    current.max - current.min;

  let percent =
    (progress / needed) * 100;

  percent =
    Math.max(
      0,
      Math.min(
        100,
        percent
      )
    );

  progressFill.style.width =
    percent + "%";

  nextLevelText.textContent =
    formatNumber(current.max);

}


function updateEnergyUI() {

  energy =
    Math.max(
      0,
      Math.min(
        maxEnergy,
        Math.floor(energy)
      )
    );

  energyEl.textContent =
    `${energy} / ${maxEnergy}`;

}


/* =====================================================
   COIN DESIGN
===================================================== */

function updateCoinDesign() {

  coin.className =
    "coin skin-" +
    selectedSkin;

  const symbols = {

    classic: "UZ",

    ocean: "≈",

    nebula: "✦",

    emerald: "◆",

    inferno: "🔥",

    cyber: "⚡",

    immortal: "♛"

  };

  coinSymbol.textContent =
    symbols[selectedSkin] || "UZ";

}


/* =====================================================
   SKIN LOCKS
===================================================== */

function updateSkinLocks() {

  document
    .querySelectorAll(".skin-option")
    .forEach(button => {

      const skinName =
        button.dataset.skin;

      const requiredLevel =
        Number(
          button.dataset.level
        );

      const unlocked =
        level >= requiredLevel;

      const status =
        button.querySelector(
          "[data-status]"
        );

      button.classList.toggle(
        "locked",
        !unlocked
      );

      button.classList.toggle(
        "selected",
        skinName === selectedSkin
      );

      if (!status) {
        return;
      }

      if (!unlocked) {

        status.textContent =
          "🔒";

      } else if (
        skinName === selectedSkin
      ) {

        status.textContent =
          "✓";

      } else {

        status.textContent =
          "SELECT";

      }

    });

}


/* =====================================================
   LEVEL UP
===================================================== */

function checkLevelUp() {

  const newLevel =
    getLevelFromBalance(balance);

  if (
    newLevel >
    lastLevel
  ) {

    level =
      newLevel;

    showLevelPopup(
      newLevel
    );

  }

  if (
    newLevel !== level
  ) {

    level =
      newLevel;

  }

  lastLevel =
    newLevel;

}


function showLevelPopup(newLevel) {

  popupIcon.textContent =
    SKINS[
      LEVELS[newLevel].skin
    ]?.icon || "⭐";

  popupText.textContent =
    `Tabriklaymiz! Level ${newLevel} ochildi.`;

  levelPopup.classList.add(
    "show"
  );

}


/* =====================================================
   TAP EFFECT
===================================================== */

function showTapEffect(
  power,
  x,
  y
) {

  const effect =
    document.createElement("div");

  effect.className =
    "tap-effect";

  effect.textContent =
    "+" + power;

  effect.style.left =
    x + "px";

  effect.style.top =
    y + "px";

  document.body.appendChild(
    effect
  );

  setTimeout(() => {
    effect.remove();
  }, 700);

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadUser() {

  try {

    if (!telegramId) {

      loading.querySelector(
        ".loading-text"
      ).textContent =
        "❌ Telegram orqali oching";

      return;

    }

    const response =
      await fetch(
        "/api/user/" +
        telegramId
      );

    if (!response.ok) {

      throw new Error(
        "Server javobi: " +
        response.status
      );

    }

    const data =
      await response.json();

    if (!data.success) {

      throw new Error(
        data.message ||
        "Foydalanuvchi topilmadi"
      );

    }

    userData =
      data.user;

    skins =
      data.skins || {};

    balance =
      Number(
        userData.balance
      ) || 0;

    level =
      getLevelFromBalance(
        balance
      );

    lastLevel =
      level;

    energy =
      Number(
        userData.energy
      );

    maxEnergy =
      Number(
        userData.max_energy
      ) || 100;

    selectedSkin =
      userData.skin ||
      "classic";


    const selected =
      skins[selectedSkin] ||
      SKINS[selectedSkin];

    if (selected) {

      tapPower =
        Number(
          selected.power
        ) || 1;

      maxEnergy =
        Number(
          selected.maxEnergy ||
          userData.max_energy
        ) || 100;

    }


    updateCoinDesign();

    updateBalance();

    updateLevelUI();

    updateEnergyUI();

    updateSkinLocks();

    loadProfile(userData);

    loadFriends(userData);

    loading.classList.add(
      "hidden"
    );

    startEnergyRegeneration();

  } catch (error) {

    console.error(
      "LOAD USER ERROR:",
      error
    );

    loading.querySelector(
      ".loading-text"
    ).textContent =
      "❌ " +
      error.message;

  }

}


/* =====================================================
   ENERGY
===================================================== */

let energyTimer = null;

let lastEnergyTime =
  Date.now();


function startEnergyRegeneration() {

  if (energyTimer) {

    clearInterval(
      energyTimer
    );

  }

  lastEnergyTime =
    Date.now();

  energyTimer =
    setInterval(() => {

      if (
        energy >= maxEnergy
      ) {

        lastEnergyTime =
          Date.now();

        return;

      }

      const now =
        Date.now();

      const elapsed =
        Math.floor(
          (now - lastEnergyTime) /
          1000
        );

      if (
        elapsed <= 0
      ) {

        return;

      }

      energy =
        Math.min(
          maxEnergy,
          energy + elapsed
        );

      lastEnergyTime +=
        elapsed * 1000;

      updateEnergyUI();

    }, 250);

}


/* =====================================================
   TAP QUEUE
===================================================== */

let pendingTaps = 0;

let tapQueueRunning = false;


function queueServerTap() {

  pendingTaps++;

  processTapQueue();

}


async function processTapQueue() {

  if (
    tapQueueRunning
  ) {

    return;

  }

  tapQueueRunning =
    true;

  while (
    pendingTaps > 0
  ) {

    pendingTaps--;

    try {

      const response =
        await fetch(
          "/api/tap",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                telegramId:
                  telegramId,

                initData:
                  initData
              })
          }
        );

      const data =
        await response.json();

      if (
        !data.success
      ) {

        balance =
          Math.max(
            0,
            balance -
            tapPower
          );

        energy =
          Math.min(
            maxEnergy,
            energy + 1
          );

        updateBalance();

        updateEnergyUI();

        continue;

      }

      if (
        pendingTaps === 0
      ) {

        balance =
          Number(
            data.balance
          );

        maxEnergy =
          Number(
            data.maxEnergy
          ) || maxEnergy;

        level =
          Number(
            data.level
          ) ||
          getLevelFromBalance(
            balance
          );

        tapPower =
          Number(
            data.tapPower
          ) ||
          tapPower;

        const serverEnergy =
          Number(
            data.energy
          );

        if (
          Number.isFinite(
            serverEnergy
          )
        ) {

          energy =
            Math.max(
              0,
              Math.min(
                maxEnergy,
                serverEnergy
              )
            );

          lastEnergyTime =
            Date.now();

        }

        updateBalance();

        updateLevelUI();

        updateEnergyUI();

        updateSkinLocks();

      }

    } catch (error) {

      console.error(
        "TAP SERVER ERROR:",
        error
      );

      balance =
        Math.max(
          0,
          balance -
          tapPower
        );

      energy =
        Math.min(
          maxEnergy,
          energy + 1
        );

      updateBalance();

      updateEnergyUI();

    }

  }

  tapQueueRunning =
    false;

}


/* =====================================================
   COIN TAP
===================================================== */

coin.addEventListener(
  "click",
  event => {

    if (
      energy <= 0
    ) {

      return;

    }

    const currentPower =
      Number(
        tapPower
      ) || 1;

    balance +=
      currentPower;

    energy =
      Math.max(
        0,
        energy - 1
      );

    lastEnergyTime =
      Date.now();

    showTapEffect(
      currentPower,
      event.clientX,
      event.clientY
    );

    updateBalance();

    updateEnergyUI();

    checkLevelUp();

    updateLevelUI();

    updateSkinLocks();

    queueServerTap();

  }
);


/* =====================================================
   SKIN SELECT
===================================================== */

document
  .querySelectorAll(".skin-option")
  .forEach(button => {

    button.addEventListener(
      "click",
      async () => {

        const skinName =
          button.dataset.skin;

        const requiredLevel =
          Number(
            button.dataset.level
          );

        if (
          level <
          requiredLevel
        ) {

          return;

        }

        if (
          skinName ===
          selectedSkin
        ) {

          return;

        }

        const oldSkin =
          selectedSkin;

        const oldPower =
          tapPower;

        const oldMaxEnergy =
          maxEnergy;

        const oldEnergy =
          energy;

        selectedSkin =
          skinName;

        const skin =
          SKINS[skinName];

        tapPower =
          skin.power;

        maxEnergy =
          skin.maxEnergy;

        energy =
          maxEnergy;

        lastEnergyTime =
          Date.now();

        updateCoinDesign();

        updateEnergyUI();

        updateSkinLocks();

        try {

          const response =
            await fetch(
              "/api/skin",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    telegramId:
                      telegramId,

                    skin:
                      skinName,

                    initData:
                      initData
                  })
              }
            );

          const data =
            await response.json();

          if (
            !data.success
          ) {

            throw new Error(
              data.message ||
              "Skin tanlashda xato"
            );

          }

          selectedSkin =
            skinName;

          tapPower =
            Number(
              data.power ||
              data.tapPower ||
              skin.power
            );

          maxEnergy =
            Number(
              data.maxEnergy ||
              skin.maxEnergy
            );

          energy =
            Number(
              data.energy
            );

          if (
            !Number.isFinite(
              energy
            )
          ) {

            energy =
              maxEnergy;

          }

          energy =
            Math.min(
              maxEnergy,
              energy
            );

          lastEnergyTime =
            Date.now();

          updateCoinDesign();

          updateEnergyUI();

          updateSkinLocks();

        } catch (error) {

          console.error(
            "SKIN ERROR:",
            error
          );

          selectedSkin =
            oldSkin;

          tapPower =
            oldPower;

          maxEnergy =
            oldMaxEnergy;

          energy =
            oldEnergy;

          lastEnergyTime =
            Date.now();

          updateCoinDesign();

          updateEnergyUI();

          updateSkinLocks();

        }

      }
    );

  });


/* =====================================================

document

        ) {

/* =====================================================
   RANK
===================================================== */

async function loadRank() {

  try {

    const response =
      await fetch(
        "/api/rank"
      );

    const data =
      await response.json();

    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        "Rank yuklanmadi"
      );

    }

    const users =
      data.users ||
      data.rank ||
      [];

    if (
      users.length === 0
    ) {

      rankList.innerHTML =
        "Hozircha rank bo‘sh.";

      return;

    }

    rankList.innerHTML =
      users
        .map(
          (user, index) => {

            const name =
              user.first_name ||
              user.username ||
              "User";

            const userBalance =
              Number(
                user.balance
              ) || 0;

            return `

              <div class="rank-row">

                <div class="rank-number">
                  #${index + 1}
                </div>

                <div class="rank-name">
                  ${escapeHtml(name)}
                </div>

                <div class="rank-balance">
                  ${formatNumber(userBalance)}
                </div>

              </div>

            `;

          }
        )
        .join("");

  } catch (error) {

    console.error(
      "RANK ERROR:",
      error
    );

    rankList.innerHTML =
      "❌ Rank yuklanmadi.";

  }

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

/* =====================================================
   SERVER ENERGY SYNC
===================================================== */

setInterval(
  async () => {

    if (!telegramId) {
      return;
    }

    if (
      pendingTaps > 0 ||
      tapQueueRunning
    ) {

      return;

    }

    try {

      const response =
        await fetch(
          "/api/user/" +
          telegramId
        );

      const data =
        await response.json();

      if (
        !data.success ||
        !data.user
      ) {

        return;

      }

      const serverUser =
        data.user;

      const serverBalance =
        Number(
          serverUser.balance
        );

      if (
        Number.isFinite(
          serverBalance
        )
      ) {

        balance =
          serverBalance;

      }

      const serverLevel =
        getLevelFromBalance(
          balance
        );

      if (
        serverLevel >
        level
      ) {

        level =
          serverLevel;

      }

      const serverMax =
        Number(
          serverUser.max_energy
        );

      if (
        Number.isFinite(
          serverMax
        ) &&
        serverMax > 0
      ) {

        maxEnergy =
          serverMax;

      }

      const serverEnergy =
        Number(
          serverUser.energy
        );

      if (
        Number.isFinite(
          serverEnergy
        )
      ) {

        energy =
          Math.max(
            0,
            Math.min(
              maxEnergy,
              serverEnergy
            )
          );

      }

      if (
        serverUser.skin
      ) {

        selectedSkin =
          serverUser.skin;

        const skin =
          SKINS[selectedSkin];

        if (skin) {

          tapPower =
            skin.power;

          if (
            !serverMax ||
            serverMax <= 0
          ) {

            maxEnergy =
              skin.maxEnergy;

          }

        }

      }

      lastEnergyTime =
        Date.now();

      updateBalance();

      updateLevelUI();

      updateEnergyUI();

      updateCoinDesign();

      updateSkinLocks();

    } catch (error) {

      console.log(
        "Energy sync error"
      );

    }

  },
  5000
);
